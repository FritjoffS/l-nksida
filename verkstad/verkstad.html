<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta author="Name" content="Fredrik Söderberg">
  <title>Verkstad</title>
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="../styles/search.css">
  <link rel="stylesheet" href="../styles/navbar.css">
  <link rel="stylesheet" href="../styles/verkstad-buttons.css">
  <!-- Add Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-database.js"></script>

  <script>
    // Initialize Firebase with your project's config
    var firebaseConfig = {
      apiKey: "AIzaSyDOFeJ1GvtXtffzCwQFg2M3CCVtpn875KQ",
      authDomain: "l-nksida.firebaseapp.com",
      databaseURL: "https://l-nksida-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "l-nksida",
      storageBucket: "l-nksida.firebasestorage.app",
      messagingSenderId: "258147870107",
      appId: "1:258147870107:web:ce637517bc30b7578cad3e"
    };
    firebase.initializeApp(firebaseConfig);

    // Function to check if a user is logged in or not
    function checkAuthState() {
      firebase.auth().onAuthStateChanged(function (user) {
        if (!user) {
          // User is not signed in, redirect to the login page
          window.location.href = "../index/login.html";
        }
      });
    }

    // Function to log out the user
    function logout() {
      firebase.auth().signOut().then(function () {
        // Sign-out successful, redirect to login page
        window.location.href = "../index/login.html";
      }).catch(function (error) {
        // Handle errors here
        console.error("Logout error:", error);
      });
    }

    // Load buttons dynamically from the database
    function loadButtons() {
      const database = firebase.database();
      const container = document.querySelector(".container");

      database.ref("aviseringar").once("value").then(snapshot => {
        snapshot.forEach(childSnapshot => {
          const key = childSnapshot.key;
          const value = childSnapshot.val();

          const button = document.createElement("button"); // Create a new button element
          button.id = key; // Use the key as the button ID
          button.className = "linkButton";
          button.innerHTML = key.replace(/Button$/, ""); // Remove "Button" suffix for display
          button.onclick = () => alert(value); // Display the value on button click
          container.appendChild(button);
        });
      });
    }

    // Load buttons on page load
    window.onload = function () {
      checkAuthState();
      loadButtons();
    };
  </script>

</head>

<body onload="checkAuthState()">

      <button class="search-bar button" type="submit">Search</button>
    </form>

  </div>

  </div>


  <script src="../scripts/verkstad.js"></script>
  <script src="../scripts/script.js"></script>
  <script src="../scripts/loadNavbar.js"></script> <!-- Add script to load navbar -->


</body>

</html>
