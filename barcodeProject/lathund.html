<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <link rel="stylesheet" href="lathund.css">

    <title>Lathund</title>

</head>

<body>

    <!-- Container for barcodes -->
    <div class="barcode-list-container">

        
        <!-- Example 1 -->
        <div class="object-container">
            <input type="text" class="benämning-input" placeholder="Benämning">
            <input type="text" class="barcode-input" id="barcode-input-1" placeholder="Barcode Number">
            <button onclick="generateBarcode('barcode-input-1'/* , 'display-value-checkbox-1' */, 'generated-barcode-1')">Generate Barcode</button>
            <div class="generated-barcode" id="generated-barcode-1"></div>
        </div>

        <!-- Example 2 -->
        <div class="object-container">
            <input type="text" class="benämning-input" placeholder="Benämning">        
            <input type="text" class="barcode-input" id="barcode-input-2" placeholder="Barcode Number">
            <button onclick="generateBarcode('barcode-input-2'/* , 'display-value-checkbox-1' */, 'generated-barcode-2')">Generate Barcode</button>
            <div class="generated-barcode" id="generated-barcode-2"></div>
        </div>

        <!-- Add more examples as needed -->
    </div>

    <script src="script.js"></script>
</body>

</html>
