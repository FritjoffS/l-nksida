<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Fredrik Söderberg" />
  <title>Motion Sensor Dashboard</title>

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#ff6600" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Järnhandel" />
  <link rel="apple-touch-icon" href="../logo.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="Järnhandel" />
  <link rel="icon" type="image/png" sizes="192x192" href="../images/logo_rund.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="../logo.png" />

  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/navbar.css" />
  <link rel="stylesheet" href="motion.css" />

  <!-- Google Analytics -->
  <script type="module" src="../scripts/analytics.js" async></script>
</head>

<body>
  <!-- Loading overlay -->
  <div id="loadingOverlay" role="alert" aria-live="polite">
    <div class="spinner"></div>
    <p>Laddar motion sensor data...</p>
  </div>

  <div id="navbar" role="navigation" aria-label="Huvudnavigering"></div>

  <main role="main">
    <div class="container">
      <header>
        <h1>Motion Sensor Dashboard</h1>
        <p>Övervakning av robotgräsklipparens driftstid</p>
        
        <div class="config-section">
          <h3>Konfiguration</h3>
          <div class="input-group">
            <label for="device-id">Device ID</label>
            <input type="text" id="device-id" placeholder="0001" value="0001">
          </div>
          <button id="loadDataBtn">Ladda data</button>
          <button id="saveConfigBtn">Spara konfiguration</button>
        </div>
      </header>

      <div id="message"></div>

      <div id="stats" style="display: none;">
        <div class="stats-grid">
          <div class="stat-card">
            <h3>Status</h3>
            <div class="value" id="device-status">
              <span class="status-indicator status-offline"></span>
              Offline
            </div>
            <div class="subtitle" id="last-seen">-</div>
          </div>
          <div class="stat-card">
            <h3>Idag</h3>
            <div class="value" id="today-time">0h 0m</div>
            <div class="subtitle" id="today-sessions">0 sessioner</div>
          </div>
          <div class="stat-card">
            <h3>Denna vecka</h3>
            <div class="value" id="week-time">0h 0m</div>
            <div class="subtitle" id="week-sessions">0 sessioner</div>
          </div>
          <div class="stat-card">
            <h3>Totalt</h3>
            <div class="value" id="total-time">0h 0m</div>
            <div class="subtitle" id="total-sessions">0 sessioner</div>
          </div>
        </div>

        <div class="sessions-section">
          <h2>Senaste sessionerna</h2>
          <div class="filters">
            <button class="filter-btn" data-filter="today">Idag</button>
            <button class="filter-btn" data-filter="week">Denna vecka</button>
            <button class="filter-btn" data-filter="month">Denna månad</button>
            <button class="filter-btn active" data-filter="all">Alla</button>
          </div>
          <div id="sessions-list"></div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="motion.js"></script>
  <script src="../scripts/loadNavbar.js"></script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../sw.js')
        .then(() => console.log('Service Worker registered'))
        .catch(err => console.error('Service Worker registration failed:', err));
    }
  </script>
</body>

</html>
