<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion Sensor Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .config-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-right: 10px;
        }

        button:hover {
            background: #5568d3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-card h3 {
            color: #888;
            font-size: 0.9em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-card .subtitle {
            color: #999;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .sessions-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .sessions-section h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .session-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 5px solid #667eea;
            transition: transform 0.2s;
        }

        .session-item:hover {
            transform: translateX(5px);
        }

        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .session-date {
            font-weight: bold;
            color: #333;
            font-size: 1.1em;
        }

        .session-duration {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .session-times {
            color: #666;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .success {
            background: #51cf66;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-online {
            background: #51cf66;
            box-shadow: 0 0 10px #51cf66;
        }

        .status-offline {
            background: #ff6b6b;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .session-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Motion Sensor Dashboard</h1>
            <p>Övervakning av robotgräsklipparens driftstid</p>
            
            <div class="config-section">
                <h3>Konfiguration</h3>
                <div class="input-group">
                    <label for="device-id">Device ID</label>
                    <input type="text" id="device-id" placeholder="0001" value="0001">
                </div>
                <button onclick="loadData()">Ladda data</button>
                <button onclick="saveConfig()">Spara konfiguration</button>
            </div>
        </header>

        <div id="message"></div>

        <div id="stats" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Status</h3>
                    <div class="value" id="device-status">
                        <span class="status-indicator status-offline"></span>
                        Offline
                    </div>
                    <div class="subtitle" id="last-seen">-</div>
                </div>
                <div class="stat-card">
                    <h3>Idag</h3>
                    <div class="value" id="today-time">0h 0m</div>
                    <div class="subtitle" id="today-sessions">0 sessioner</div>
                </div>
                <div class="stat-card">
                    <h3>Denna vecka</h3>
                    <div class="value" id="week-time">0h 0m</div>
                    <div class="subtitle" id="week-sessions">0 sessioner</div>
                </div>
                <div class="stat-card">
                    <h3>Totalt</h3>
                    <div class="value" id="total-time">0h 0m</div>
                    <div class="subtitle" id="total-sessions">0 sessioner</div>
                </div>
            </div>

            <div class="sessions-section">
                <h2>Senaste sessionerna</h2>
                <div class="filters">
                    <button onclick="filterSessions('today')">Idag</button>
                    <button onclick="filterSessions('week')">Denna vecka</button>
                    <button onclick="filterSessions('month')">Denna månad</button>
                    <button onclick="filterSessions('all')">Alla</button>
                </div>
                <div id="sessions-list"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
        import { firebaseConfig } from "../scripts/firebase-config.js";

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let allSessions = [];
        let currentFilter = 'all';

        // Ladda sparad konfiguration
        window.onload = function() {
            const savedDeviceId = localStorage.getItem('motion-device-id');
            
            if (savedDeviceId) {
                document.getElementById('device-id').value = savedDeviceId;
                loadData();
            }
        };

        function saveConfig() {
            const deviceId = document.getElementById('device-id').value;
            
            if (!deviceId) {
                showMessage('Ange ett Device ID!', 'error');
                return;
            }
            
            localStorage.setItem('motion-device-id', deviceId);
            showMessage('Konfiguration sparad!', 'success');
        }

        async function loadData() {
            const deviceId = document.getElementById('device-id').value;
            
            if (!deviceId) {
                showMessage('Ange ett Device ID!', 'error');
                return;
            }

            showMessage('Laddar data...', 'loading');

            try {
                // Hämta status från Firebase
                const statusRef = ref(db, `motion/${deviceId}/status`);
                const statusSnapshot = await get(statusRef);
                const statusData = statusSnapshot.val();

                // Hämta events från Firebase
                const eventsRef = ref(db, `motion/${deviceId}/events`);
                const eventsSnapshot = await get(eventsRef);
                const eventsData = eventsSnapshot.val();

                if (!eventsData) {
                    showMessage('Ingen data hittades för denna enhet.', 'error');
                    return;
                }

                // Bearbeta data
                processData(statusData, eventsData);
                document.getElementById('stats').style.display = 'block';
                clearMessage();

            } catch (error) {
                showMessage('Fel vid hämtning av data: ' + error.message, 'error');
                console.error(error);
            }
        }

        function processData(status, events) {
            allSessions = [];

            // Extrahera alla sessioner
            for (const year in events) {
                for (const month in events[year]) {
                    for (const day in events[year][month]) {
                        for (const sessionId in events[year][month][day]) {
                            const session = events[year][month][day][sessionId];
                            if (session.timestamp_start) {
                                allSessions.push({
                                    ...session,
                                    id: sessionId,
                                    date: `${year}-${month}-${day}`
                                });
                            }
                        }
                    }
                }
            }

            // Sortera sessioner (nyast först)
            allSessions.sort((a, b) => {
                return new Date(b.timestamp_start) - new Date(a.timestamp_start);
            });

            // Uppdatera status
            updateStatus(status);

            // Beräkna statistik
            calculateStats();

            // Visa sessioner
            displaySessions();
        }

        function updateStatus(status) {
            if (status && status.device_online) {
                document.getElementById('device-status').innerHTML = 
                    '<span class="status-indicator status-online"></span>Online';
                document.getElementById('last-seen').textContent = 
                    'Senast sedd: ' + status.started_at;
            } else {
                document.getElementById('device-status').innerHTML = 
                    '<span class="status-indicator status-offline"></span>Offline';
            }
        }

        function calculateStats() {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const weekAgo = new Date(today);
            weekAgo.setDate(weekAgo.getDate() - 7);

            let todayTime = 0, todayCount = 0;
            let weekTime = 0, weekCount = 0;
            let totalTime = 0, totalCount = 0;

            allSessions.forEach(session => {
                const sessionDate = new Date(session.timestamp_start);
                const duration = session.duration_ms || 0;

                totalTime += duration;
                totalCount++;

                if (sessionDate >= today) {
                    todayTime += duration;
                    todayCount++;
                }

                if (sessionDate >= weekAgo) {
                    weekTime += duration;
                    weekCount++;
                }
            });

            document.getElementById('today-time').textContent = formatDuration(todayTime);
            document.getElementById('today-sessions').textContent = todayCount + ' sessioner';

            document.getElementById('week-time').textContent = formatDuration(weekTime);
            document.getElementById('week-sessions').textContent = weekCount + ' sessioner';

            document.getElementById('total-time').textContent = formatDuration(totalTime);
            document.getElementById('total-sessions').textContent = totalCount + ' sessioner';
        }

        function filterSessions(filter) {
            currentFilter = filter;
            displaySessions();
        }

        function displaySessions() {
            const container = document.getElementById('sessions-list');
            container.innerHTML = '';

            let filteredSessions = [...allSessions];

            // Filtrera baserat på vald period
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

            if (currentFilter === 'today') {
                filteredSessions = filteredSessions.filter(s => {
                    const sessionDate = new Date(s.timestamp_start);
                    return sessionDate >= today;
                });
            } else if (currentFilter === 'week') {
                const weekAgo = new Date(today);
                weekAgo.setDate(weekAgo.getDate() - 7);
                filteredSessions = filteredSessions.filter(s => {
                    const sessionDate = new Date(s.timestamp_start);
                    return sessionDate >= weekAgo;
                });
            } else if (currentFilter === 'month') {
                const monthAgo = new Date(today);
                monthAgo.setMonth(monthAgo.getMonth() - 1);
                filteredSessions = filteredSessions.filter(s => {
                    const sessionDate = new Date(s.timestamp_start);
                    return sessionDate >= monthAgo;
                });
            }

            if (filteredSessions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p style="font-size: 1.2em;">Inga sessioner hittades</p>
                        <p>Väntar på data från sensorn...</p>
                    </div>
                `;
                return;
            }

            // Visa sessioner
            filteredSessions.forEach(session => {
                const div = document.createElement('div');
                div.className = 'session-item';

                const hasEnded = session.timestamp_stop;
                const durationText = hasEnded ? session.motion_time : 'Pågående...';

                div.innerHTML = `
                    <div class="session-header">
                        <div class="session-date">${formatDate(session.timestamp_start)}</div>
                        <div class="session-duration">${durationText}</div>
                    </div>
                    <div class="session-times">
                        Start: ${formatTime(session.timestamp_start)}
                        ${hasEnded ? ` • Stopp: ${formatTime(session.timestamp_stop)}` : ''}
                    </div>
                `;

                container.appendChild(div);
            });
        }

        function formatDuration(ms) {
            const hours = Math.floor(ms / 3600000);
            const minutes = Math.floor((ms % 3600000) / 60000);
            return `${hours}h ${minutes}m`;
        }

        function formatDate(timestamp) {
            const date = new Date(timestamp);
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);

            if (date.toDateString() === today.toDateString()) {
                return 'Idag';
            } else if (date.toDateString() === yesterday.toDateString()) {
                return 'Igår';
            } else {
                return date.toLocaleDateString('sv-SE', { 
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric' 
                });
            }
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString('sv-SE', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.className = type;
            messageDiv.textContent = text;
            messageDiv.style.display = 'block';
        }

        function clearMessage() {
            document.getElementById('message').style.display = 'none';
        }
    </script>
</body>
</html>
