<!DOCTYPE html>
<html lang="sv">



<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta author="Name" content="Fredrik Söderberg">
  <title>Lathund</title>
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="../styles/search.css">
  <link rel="stylesheet" href="../styles/navbar.css">
  <link rel="stylesheet" href="lathund.css">
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.5/xlsx.full.min.js"></script>
</head>

<body>
  <div id="navbar"></div> <!-- Placeholder for the navbar -->
  <div id="sidenav">
    <button class="sidenav" id="insertButton" title="Spara formuläret som en ny sida">Spara som ny sida</button>
    <button class="sidenav" id="updateButton" title="Spara ändringar i den valda sidan">Spara ändringar</button>
    <button class="sidenav" id="deleteButton" title="Radera den valda sidan permanent">Radera aktuell sida</button>
    <button class="sidenav" id="printButton" title="Skriv ut sidan till PDF eller skrivare">Skriv ut sidan</button>
    <button class="sidenav" id="clearButton" title="Rensa alla fält i formuläret">Rensa formuläret</button>
    <button class="sidenav" id="exportButton" title="Exportera den valda sidan till Excel">Exportera data</button>
    <button class="sidenav" id="importButton" title="Importera data från Excel-fil">Importera data</button>
    <select id="savedTitlesDropdown" title="Välj en sparad sida att ladda"></select>

  </div>

  <div class="formcontainer">

    <br>
    <header class="header">

      <input type="text" id="titleInput" placeholder="Överskrift">

    </header>

    <div>
      <form class="formulär" id="productForm">
        <!-- Container for dynamic sections -->
      </form>
      <br><br>
    </div>
  </div>

  <br>

  <script type="module" src="lathund.js"></script>
  <script src="../scripts/loadNavbar.js"></script> <!-- Add script to load navbar -->

</body>

</html>
