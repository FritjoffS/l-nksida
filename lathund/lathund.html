<!DOCTYPE html>
<html lang="sv">



<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta author="Name" content="Fredrik Söderberg">
  <title>Lathund</title>
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="../styles/search.css">
  <link rel="stylesheet" href="../styles/navbar.css">
  <link rel="stylesheet" href="lathund.css">
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
</head>

<body>
  <div id="navbar"></div> <!-- Placeholder for the navbar -->
  <div id="toolbar" role="toolbar" aria-label="Lathund-verktyg">
    <div class="toolbar-picker">
      <label for="pageSearch">Öppna lathund</label>
      <input type="search" id="pageSearch" placeholder="Sök sida…" autocomplete="off" title="Skriv för att filtrera listan. Enter öppnar första träffen.">
      <select id="savedTitlesDropdown" title="Välj en sparad sida att ladda" aria-label="Sparade sidor"></select>
      <span id="pageStatus" class="page-status" aria-live="polite"></span>
    </div>
    <div class="toolbar-actions">
      <div class="btn-group">
        <button class="btn btn-primary" id="saveButton" title="Spara sidan (Ctrl+S)">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>Spara
        </button>
        <button class="btn" id="insertButton" title="Spara formuläret som en ny sida">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Spara som ny
        </button>
        <button class="btn" id="clearButton" title="Börja på en ny, tom sida">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Ny tom sida
        </button>
      </div>
      <div class="btn-group">
        <button class="btn" id="printButton" title="Skriv ut sidan till PDF eller skrivare">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>Skriv ut
        </button>
        <button class="btn" id="exportButton" title="Exportera den valda sidan till Excel">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>Exportera
        </button>
        <button class="btn" id="importButton" title="Importera data från Excel-fil">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>Importera
        </button>
        <button class="btn btn-danger" id="deleteButton" title="Radera den valda sidan permanent">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>Radera
        </button>
      </div>
    </div>
  </div>
  <div id="toastContainer" aria-live="polite"></div>

  <div class="formcontainer">
    <header class="header">
      <input type="text" id="titleInput" placeholder="Skriv en överskrift…" aria-label="Överskrift">
    </header>

    <div>
      <span class="visually-hidden" id="rowMoveHelp">Dra i handtaget för att flytta raden. Med tangentbordet: använd uppåt- och nedåtpil.</span>
      <span class="visually-hidden" id="rowMoveStatus" role="status" aria-live="polite"></span>
      <form class="formulär" id="productForm">
        <!-- Container for dynamic sections -->
      </form>
      <div class="row-actions">
        <button type="button" class="btn" id="addRowButton" aria-describedby="rowCountStatus">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Lägg till rad
        </button>
        <span id="rowCountStatus" class="row-count" aria-live="polite"></span>
        <span class="row-hint" aria-hidden="true">Dra i handtaget för att flytta en rad</span>
      </div>
    </div>
  </div>

  <script type="module" src="lathund.js"></script>
  <script src="../scripts/loadNavbar.js"></script> <!-- Add script to load navbar -->

</body>

</html>
