<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Testpage</title>
  </head>
  <body>
    <article id="contact">
      <h2>Contact Me</h2>
      <p>I'd really like to hear from you!</p>

      <form action="https://httpbin.org/get" method="get">
        <fieldset>
          <legend>Personal info</legend>
          <p>
            <label for="firstName">First Name:</label>
            <input
              type="text"
              name="firstName"
              id="firstName"
              placeholder="Jane"
              autocomplete="on"
              required
              autofocus
            />
          </p>
          <br />
          <p>
            <label for="lastName">Last Name:</label>
            <input
              type="text"
              name="lastName"
              id="lastName"
              placeholder="Doe"
              autocomplete="on"
              required
            />
          </p>
          <br />
          <p>
            <label for="password">Password:</label>
            <input
              type="password"
              name="password"
              id="password"
              placeholder="secret"
              required
            />
          </p>
          <br />
          <p>
            <label for="phone">Phone:</label>
            <input
              type="tel"
              name="phone"
              id="phone"
              placeholder="5555555555"
              pattern="[0-9]{3}[0-9]{3}[0-9]{4}"
              required
            />
          </p>
          <br />
          <p>
            <label for="decade">Favorite decade:</label>
            <input
              type="number"
              name="decade"
              id="decade"
              min="1950"
              max="2024"
              step="10"
              value="1980"
            />
          </p>
          <br />

          <p>
            <label for="coffe">Favorite coffe</label>
            <select name="coffe" id="coffe" multple size="5">
              <optgroup label="coffes">
                <option value="regular coffe">Regular Coffe</option>
                <option value="iced coffe">Iced Coffe</option>
              </optgroup>
              <optgroup label="espresso drinks">
                <option value="latte" selected>Latte</option>
                <option value="cappuccino">Cappuccino</option>
                <option value="espresso">Espresso</option>
              </optgroup>
              <option value="other">Other</option>
            </select>
          </p>
          <br />

          <p>
            <label for="coffe">Favorite coffe</label>
            <select name="coffe" id="coffe">
              <optgroup label="coffes">
                <option value="regular coffe">Regular Coffe</option>
                <option value="iced coffe">Iced Coffe</option>
              </optgroup>
              <optgroup label="espresso drinks">
                <option value="latte" selected>Latte</option>
                <option value="cappuccino">Cappuccino</option>
                <option value="espresso">Espresso</option>
              </optgroup>
              <option value="other">Other</option>
            </select>
          </p>

                       
           <p>
            <label for="coffee">Favorite Coffee:</label>
            <input type="text" name="coffee" id="coffee" list="coffee-list">
            <datalist id="coffee-list">
                <option value="coffee">
                <option value="latte">
                <option value="espresso">
                <option value="cortado">
                <option value="americano">
                <option value="other">
            </datalist>
        </p>
        
        </fieldset>
        <br />
        <fieldset>
          <legend>What is your favorite food?</legend>
          <p>
            <input type="radio" name="food" id="tacos" value="tacos" />
            <label for="tacos">Tacos</label>
          </p>
          <p>
            <input type="radio" name="food" id="pizza" value="pizza" />
            <label for="pizza">Pizza</label>
          </p>
          <p>
            <input type="radio" name="food" id="other" value="other" />
            <label for="other">Other</label>
          </p>
        </fieldset>
        <br />
        <fieldset>
          <legend>Do you have pets?</legend>
          <p>
            <input type="checkbox" name="pet" id="dog" value="dog" />
            <label for="dog">Dog</label>
          </p>
          <p>
            <input type="checkbox" name="pet" id="cat" value="cat" />
            <label for="cat">Cat</label>
          </p>
          <p>
            <input type="checkbox" name="pet" id="fish" value="fish" />
            <label for="fish">Fish</label>
          </p>
          <p>
            <input type="checkbox" name="pet" id="otherPet" value="otherPet" />
            <label for="otherPet">Other</label>
          </p>
        </fieldset>

        <br />
        <fieldset>
          <legend>Send Me a note</legend>
          <label for="message">Your message:</label>
          <br />
          <textarea
            name="message"
            id="message"
            cols="30"
            rows="10"
            placeholder="Type your message here"
          ></textarea>
        </fieldset>
        <br />
        <button type="submit">Submit</button>
        <button
          type="submit"
          formaction="https://httpbin.org/post"
          formmethod="post"
        >
          Post
        </button>
        <button type="reset">Reset</button>
      </form>
    </article>
  </body>
</html>
