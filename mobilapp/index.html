<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrilager Inventeringsapp</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <script src="app.js" defer></script>
</head>
<body>
    <div id="app">
        <header>
            <h1>Industrilager</h1>
        </header>
        <main>
            <section id="customerSelect" class="active">
                <h2>Välj kund</h2>
                <div id="customerList"></div>
                    <button id="manageCustomersBtn" style="margin-top:12px;">Hantera kunder</button>
            </section>
            <section id="manageCustomers" class="hidden">
                <h2>Hantera kunder</h2>
                <ul id="manageCustomerList"></ul>
                <div style="display:flex;gap:8px;margin:16px 0 0 0;">
                    <button id="deleteCustomerBtn" style="flex:1;">Radera vald kund</button>
                    <button id="editCustomerBtn" style="flex:1;">Redigera vald kund</button>
                </div>
                <form id="addCustomerForm" style="margin-top:24px;">
                    <input type="text" id="customerName" placeholder="Ny kund" required style="width:100%;box-sizing:border-box;">
                    <button type="submit">Spara kund</button>
                </form>
                <button onclick="showPage('customerSelect')">Tillbaka</button>
            </section>
            <section id="start" class="hidden">
                <h2 id="currentCustomerHeader"></h2>
                <button onclick="showPage('order')">Order</button>
                <button onclick="showPage('lager')">Lagerlagda Artiklar</button>
                <button onclick="showPage('orders')">Beställningshistorik</button>
                <button onclick="showPage('notes')">Anteckningar</button>
                <button onclick="showPage('customerSelect')">Byt kund</button>
            </section>
            <section id="orders" class="hidden">
                <div id="currentCustomerOrders" style="text-align:center;margin-bottom:16px;font-weight:bold;color:#555;"></div>
                <div id="currentRecipientOrders" style="text-align:center;margin-bottom:16px;font-style:italic;color:#777;"></div>
                <h2>Beställningshistorik</h2>
                <ul id="orderHistoryList"></ul>
                <button onclick="showPage('start')">Tillbaka</button>
            </section>
            <section id="orderDetails" class="hidden">
                <h2>Orderdetaljer</h2>
                <ul id="orderDetailsList"></ul>
                <button onclick="returnToOrderHistory()">Tillbaka</button>
            </section>
            <section id="lager" class="hidden">
                <div id="currentCustomerLager" style="text-align:center;margin-bottom:16px;font-weight:bold;color:#555;"></div>
                <div id="currentRecipientLager" style="text-align:center;margin-bottom:16px;font-style:italic;color:#777;"></div>
                <h2>Lägg till produkt</h2>
                
                <!-- Streckkodsläsare för lager -->
                <div style="border:1px solid #ddd;padding:12px;margin:16px 0;border-radius:8px;background:#f0f8ff;">
                    <button id="startBarcodeScanner" style="width:100%;margin-bottom:8px;background:#4CAF50;color:white;border:none;padding:12px;border-radius:4px;">📷 Skanna streckkod</button>
                    <div id="barcodeScannerContainer" style="display:none;position:relative;">
                        <div id="interactive" style="width:100%;height:300px;border:1px solid #ccc;position:relative;overflow:hidden;"></div>
                        <button id="stopBarcodeScanner" style="width:100%;margin-top:8px;background:#f44336;color:white;border:none;padding:8px;border-radius:4px;">Stoppa skanning</button>
                    </div>
                </div>
                
                <form id="addProductForm">
                    <input type="text" id="produktnummer" placeholder="Produktnummer" required style="width:100%;box-sizing:border-box;margin-top:8px;">
                    <input type="text" id="benamning" placeholder="Benämning" required style="width:100%;box-sizing:border-box;">
                    <input type="number" id="lagerAntal" placeholder="Lager antal" required style="width:100%;box-sizing:border-box;">
                    <button type="submit">Spara</button>
                </form>
                <h3>Produkter</h3>
                <ul id="productList"></ul>
                <button onclick="showPage('start')">Tillbaka</button>
            </section>
            <section id="order" class="hidden">
                <div id="currentCustomerOrder" style="text-align:center;margin-bottom:16px;font-weight:bold;color:#555;"></div>
                <div id="currentRecipientOrder" style="text-align:center;margin-bottom:16px;font-style:italic;color:#777;"></div>
                <h2>Order</h2>
                
                <!-- Manuell orderrad-inmatning -->
                <div style="border:1px solid #ddd;padding:12px;margin:16px 0;border-radius:8px;background:#f9f9f9;">
                    <h3 style="margin:0 0 12px 0;font-size:16px;">Lägg till orderrad manuellt</h3>
                    
                    <form id="manualOrderForm">
                        <!-- Streckkodsläsare för order -->
                        <button type="button" id="startBarcodeOrderScanner" style="width:100%;margin-bottom:12px;background:#4CAF50;color:white;border:none;padding:12px;border-radius:4px;">📷 Skanna streckkod</button>
                        <div id="barcodeOrderScannerContainer" style="display:none;margin-bottom:12px;position:relative;">
                            <div id="orderInteractive" style="width:100%;height:300px;border:1px solid #ccc;position:relative;overflow:hidden;"></div>
                            <button type="button" id="stopBarcodeOrderScanner" style="width:100%;margin-top:8px;background:#f44336;color:white;border:none;padding:8px;border-radius:4px;">Stoppa skanning</button>
                        </div>
                        
                        <input type="text" id="manualProductNumber" placeholder="Produktnummer (valfritt)" style="width:100%;box-sizing:border-box;margin-bottom:8px;">
                        <input type="text" id="manualProductName" placeholder="Produktnamn" required style="width:100%;box-sizing:border-box;margin-bottom:8px;">
                        <input type="number" id="manualQuantity" placeholder="Antal" required min="1" style="width:100%;box-sizing:border-box;margin-bottom:8px;">
                        <button type="submit" style="width:100%;">Lägg till i order</button>
                    </form>
                </div>
                
                <form id="orderForm">
                    <h3>Produkter från Lagerlagda Artiklar:</h3>
                    <ul id="orderList"></ul>
                    <h3>Manuella orderrader:</h3>
                    <ul id="manualOrderList"></ul>
                    <button type="submit">Spara beställning</button>
                </form>
                <button onclick="confirmLeaveOrder()">Tillbaka</button>
            </section>
            <section id="notes" class="hidden">
                <div id="currentCustomerNotes" style="text-align:center;margin-bottom:16px;font-weight:bold;color:#555;"></div>
                <div id="currentRecipientNotes" style="text-align:center;margin-bottom:16px;font-style:italic;color:#777;"></div>
                <h2>Anteckningar</h2>
                
                <div style="margin-bottom:16px;">
                    <textarea id="notesTextarea" placeholder="Skriv dina anteckningar här..." style="width:100%;height:300px;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:4px;font-family:Arial,sans-serif;font-size:14px;resize:vertical;"></textarea>
                </div>
                
                <div style="display:flex;gap:8px;margin-bottom:16px;">
                    <button onclick="saveNotes()" style="flex:1;background:#4CAF50;color:white;border:none;padding:12px;border-radius:4px;cursor:pointer;">💾 Spara anteckningar</button>
                    <button onclick="clearNotes()" style="flex:1;background:#ff9800;color:white;border:none;padding:12px;border-radius:4px;cursor:pointer;">🗑️ Rensa</button>
                </div>
                
                <div id="notesSaveStatus" style="text-align:center;margin-bottom:16px;font-style:italic;color:#666;"></div>
                
                <button onclick="showPage('start')">Tillbaka</button>
            </section>
        </main>
    </div>
</body>
</html>
