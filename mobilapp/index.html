<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrilager Inventeringsapp</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="app.js" defer></script>
</head>
<body>
    <div id="app">
        <header>
            <h1>Industrilager</h1>
        </header>
        <main>
            <section id="customerSelect" class="active">
                <h2>Välj kund</h2>
                <div id="customerList"></div>
                <form id="addCustomerForm" style="margin-top:24px;">
                    <input type="text" id="customerName" placeholder="Ny kund" required>
                    <button type="submit">Spara kund</button>
                </form>
            </section>
            <section id="start" class="hidden">
                <h2 id="currentCustomerHeader"></h2>
                <button onclick="showPage('order')">Order</button>
                <button onclick="showPage('lager')">Lager</button>
                <button onclick="showPage('orders')">Beställningshistorik</button>
                <button onclick="showPage('customerSelect')">Byt kund</button>
            </section>
            <section id="orders" class="hidden">
                <h2>Beställningshistorik</h2>
                <ul id="orderHistoryList"></ul>
                <button onclick="showPage('start')">Tillbaka</button>
            </section>
            <section id="orderDetails" class="hidden">
                <h2>Orderdetaljer</h2>
                <ul id="orderDetailsList"></ul>
                <button onclick="showPage('orders')">Tillbaka</button>
            </section>
            <section id="lager" class="hidden">
                <h2>Lägg till produkt</h2>
                <form id="addProductForm">
                    <input type="text" id="benamning" placeholder="Benämning" required>
                    <input type="text" id="produktnummer" placeholder="Produktnummer" required style="margin-top:8px;">
                    <input type="number" id="lagerAntal" placeholder="Lager antal" required>
                    <button type="submit">Spara</button>
                </form>
                <h3>Produkter</h3>
                <ul id="productList"></ul>
                <button onclick="showPage('start')">Tillbaka</button>
            </section>
            <section id="order" class="hidden">
                <h2>Order</h2>
                <form id="orderForm">
                    <ul id="orderList"></ul>
                    <button type="submit">Spara beställning</button>
                </form>
                <button onclick="showPage('start')">Tillbaka</button>
            </section>
        </main>
    </div>
</body>
</html>
