<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Aviseringar</title>
  <!-- Adjusted relative paths -->
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../aviseringar/styles.css" />
  <link rel="stylesheet" href="../styles/navbar.css" />
</head>

<body>
  <div id="navbar"></div> <!-- Placeholder for the navbar -->

  <div class="mainContainer">

    <div class="container">

      <div class="innerContainer">

        <div class="topContainer">

          <h1>Aviseringar</h1>
          <h2>Administration</h2>

          <h2>Lägg Upp Ny Post</h2>

          <div>
            <label for="newKey">Benämning:</label>
            <br>
            <input type="text" id="newKey" placeholder="Benämning" />
            <br />
            <label for="newValue">Beskrivning:</label>
            <br>
            <textarea id="newValue" placeholder="Text"></textarea>
            <br />
            <button onclick="addEntry()">Spara Post</button>
          </div>

        </div>

        <div class="bottomContainer">

          <h2>SPARADE AVISERINGAR</h2>
          <table border="1">
            <thead>
              <tr>
                <th>Benämning</th>
                <!-- <th>Value</th> -->
                <th>Åtgärd</th>
              </tr>
            </thead>
            <tbody id="entriesTableBody">
              <!-- Entries will be dynamically loaded here -->
            </tbody>
          </table>

        </div>

      </div>

    </div>

  </div>

  <!-- Modal for editing text -->
  <div id="editModal">
    <h3>Redigera Avisering</h3>
    <label for="editKeyInput">Benämning:</label>
    <input id="editKeyInput" type="text" />
    <label for="editTextarea">Beskrivning:</label>
    <textarea id="editTextarea"></textarea>
    <br />
    <button class="saveButton" onclick="saveEdit()">Spara</button>
    <button class="closeButton" onclick="closeModal()">Avbryt</button>
  </div>

  <div id="modalOverlay" onclick="closeModal()"></div>

  <script type="module">
    import { database, ref, get, set, remove } from '../scripts/firebase-config.js';

    let currentEditKey = null;

    // Function to fetch and display all database entries
    function loadEntries() {
      const tableBody = document.getElementById("entriesTableBody");
      tableBody.innerHTML = ""; // Clear existing rows

      get(ref(database, "aviseringar")).then(snapshot => {
        snapshot.forEach(childSnapshot => {
          const key = childSnapshot.key;
          const data = childSnapshot.val();
          const value = data && data.label ? data.label : ""; // Ensure value is a string

          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${key}</td>
            <!-- <td>${value}</td> -->
            <td>
              <button onclick="editEntry('${key}', '${value.replace(/'/g, "\\'")}')">Ändra Post</button>
              <button onclick="deleteEntry('${key}')">Radera Post</button>
            </td>
          `;
          tableBody.appendChild(row);
        });
      }).catch(error => {
        console.error("Error loading entries:", error);
      });
    }

    // Function to add a new entry
    window.addEntry = function addEntry() {
      const key = document.getElementById("newKey").value.trim();
      const value = document.getElementById("newValue").value.trim();

      if (key && value) {
        set(ref(database, "aviseringar/" + key), value).then(() => {
          alert("Entry added successfully!");
          loadEntries();
        }).catch(error => {
          console.error("Error adding entry:", error);
        });
      } else {
        alert("Both key and value are required.");
      }
    }

    // Function to delete an entry
    window.deleteEntry = function deleteEntry(key) {
      if (confirm(`Are you sure you want to delete "${key}"?`)) {
        remove(ref(database, "aviseringar/" + key)).then(() => {
          alert("Entry deleted successfully!");
          loadEntries();
        }).catch(error => {
          console.error("Error deleting entry:", error);
        });
      }
    }

    window.editEntry = function editEntry(key) {
      // Fetch the current value from the database
      get(ref(database, "aviseringar/" + key)).then(snapshot => {
        const currentValue = snapshot.val();

        // Show the modal and populate the input fields with the current key and value
        currentEditKey = key;
        document.getElementById("editKeyInput").value = key;
        document.getElementById("editTextarea").value = currentValue || "";
        document.getElementById("editModal").style.display = "block";
        document.getElementById("modalOverlay").style.display = "block";
      }).catch(error => {
        console.error("Error fetching current value for editing:", error);
      });
    }

    window.saveEdit = function saveEdit() {
      const newKey = document.getElementById("editKeyInput").value.trim();
      const newValue = document.getElementById("editTextarea").value.trim();

      if (currentEditKey && newKey && newValue) {
        // If the key has changed, remove the old key and save the new key-value pair
        if (currentEditKey !== newKey) {
          remove(ref(database, "aviseringar/" + currentEditKey)).then(() => {
            set(ref(database, "aviseringar/" + newKey), newValue).then(() => {
              alert("Entry updated successfully!");
              closeModal();
              loadEntries();
            }).catch(error => {
              console.error("Error updating entry:", error);
            });
          }).catch(error => {
            console.error("Error removing old key:", error);
          });
        } else {
          // If the key hasn't changed, just update the value
          set(ref(database, "aviseringar/" + currentEditKey), newValue).then(() => {
            alert("Entry updated successfully!");
            closeModal();
            loadEntries();
          }).catch(error => {
            console.error("Error updating entry:", error);
          });
        }
      }
    }

    window.closeModal = function closeModal() {
      document.getElementById("editModal").style.display = "none";
      document.getElementById("modalOverlay").style.display = "none";
      currentEditKey = null;
    }

    // Load entries on page load
    loadEntries();
  </script>
  <script src="../scripts/loadNavbar.js"></script>

</body>

</html>
