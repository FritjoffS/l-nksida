    <div class="container">
        <button id="copyButton1" class="copyButton">Cykel Klar</button>
        <!-- Add similar buttons for other messages -->
    </div>

    <script>


        function copyTextToClipboard(textToCopy) {
            var textarea = document.createElement("textarea");
            textarea.value = textToCopy;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand("copy");
            document.body.removeChild(textarea);
            alert("Texten har kopierats till urklippet:\n" + textToCopy);
        }

        document.getElementById("copyButton1").addEventListener("click", function () {
            var cykelText = localStorage.getItem('cykelText');
            copyTextToClipboard(cykelText);
        });
        // Add similar event listeners for other buttons
    </script>
</body>

</html>
