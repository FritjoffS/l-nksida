<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta author="Name" content="Fredrik Söderberg" />
  <title>Aviseringar</title>
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/navbar.css" />
  <link rel="stylesheet" href="../styles/generic-buttons.css" />
</head>

<body>
  <div id="navbar"></div> <!-- Placeholder for the navbar -->
  
  <div class="container">
  </div>

  <script type="module">
    import { auth, onAuthStateChanged, signOut } from '../scripts/firebase-config.js';
    import '../scripts/aviseringar.js';

    // Function to check if a user is logged in or not
    function checkAuthState() {
      onAuthStateChanged(auth, function (user) {
        if (!user) {
          // User is not signed in, redirect to the login page
          window.location.href = "../index/login.html";
        }
      });
    }

    // Function to log out the user
    window.logout = function logout() {
      signOut(auth).then(function () {
        // Sign-out successful, redirect to login page
        window.location.href = "../index/login.html";
      }).catch(function (error) {
        // Handle errors here
        console.error("Logout error:", error);
      });
    };

    // Load on page load
    checkAuthState();
    window.loadButtons();
  </script>
  <script src="../scripts/loadNavbar.js"></script>

</body>

</html>
