<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Fredrik Söderberg" />
  <meta name="description" content="Inloggningssida" />
  <title>Logga in</title>

  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/login.css" />

  <!-- Google Analytics -->
  <script type="module" src="../scripts/analytics.js" async></script>
</head>

<body>
  <div class="login-container">
    <div class="login-box">
      <div class="logo-container">
        <h1>Välkommen</h1>
        <p class="subtitle">Logga in för att fortsätta</p>
      </div>

      <div id="errorMessage" class="error-message" style="display: none;"></div>

      <form id="loginForm" autocomplete="on">
        <div class="input-group">
          <label for="email">E-post</label>
          <input 
            type="email" 
            id="email" 
            required 
            placeholder="din.epost@exempel.se" 
            autocomplete="username"
            spellcheck="false"
          />
        </div>

        <div class="input-group">
          <label for="password">Lösenord</label>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="password" 
              required 
              placeholder="Ditt lösenord" 
              autocomplete="current-password"
            />
            <button type="button" id="togglePassword" class="toggle-password" title="Visa/dölj lösenord">👁️</button>
          </div>
        </div>

        <div class="form-actions">
          <a href="#" id="forgotPassword" class="forgot-password">Glömt lösenord?</a>
        </div>

        <button type="button" id="loginButton" class="login-button">
          <span id="loadingSpinner" class="spinner" style="display: none;"></span>
          Logga in
        </button>
      </form>

      <div class="footer-text">
        <p>Endast för behöriga användare</p>
      </div>
    </div>
  </div>

  <script type="module" src="login.js"></script>
</body>

</html>
