<!DOCTYPE html>
<html>
<head>
  <title>Login Page</title>
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/login.css" />
  <!-- Add Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-auth.js"></script>
  
  
  <script>
    // Initialize Firebase with your project's config
    var firebaseConfig = {
        apiKey: "AIzaSyDOFeJ1GvtXtffzCwQFg2M3CCVtpn875KQ",
        authDomain: "l-nksida.firebaseapp.com",
        databaseURL: "https://l-nksida-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "l-nksida",
        storageBucket: "l-nksida.firebasestorage.app",
        messagingSenderId: "258147870107",
        appId: "1:258147870107:web:ce637517bc30b7578cad3e"
    };
    firebase.initializeApp(firebaseConfig);
  </script>

  <script>
    // Function to check if a user is logged in or not
    function checkAuthState() {
      firebase.auth().onAuthStateChanged(function(user) {
        if (user) {
          // User is signed in, proceed to the website
          window.location.href = "index.html";
        } else {
          // No user is signed in, clear input fields
          document.getElementById("email").value = "";
          document.getElementById("password").value = "";
        }
      });
    }

    // Function to handle the login form submission
    function login() {
      var email = document.getElementById("email").value;
      var password = document.getElementById("password").value;

      firebase.auth().signInWithEmailAndPassword(email, password)
        .then(function() {
          // Login successful, redirect to the homepage
          window.location.href = "index.html";
        })
        .catch(function(error) {
          // Handle errors here
          var errorCode = error.code;
          var errorMessage = error.message;
          console.log("Login error:", errorCode, errorMessage);
        });
    }
  </script>
  
</head>
<body onload="checkAuthState()">
  <h1 style="display: none;">Login Page</h1>
  <form>
    <!-- <label for="email">Email:</label> -->
    <input type="email" id="email" required placeholder="Email"><br>
    <!-- <label for="password">Password:</label> -->
    <input type="password" id="password" required placeholder="Password"><br>
    <button type="button" onclick="login()">Login</button>
  </form>
  <!-- Add a note for users redirected after logout -->
  <!-- <p>If you were logged out, please log in again to continue.</p> -->
</body>
</html>
