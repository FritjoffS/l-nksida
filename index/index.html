<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta author="Fredrik Söderberg" />
  <title>Home</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#ff6600" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Järnhandel" />
  <link rel="apple-touch-icon" href="../logo.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="../images/logo_rund.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="../logo.png" />
  
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/date_time.css" />
  <link rel="stylesheet" href="../styles/search.css" />
  <link rel="stylesheet" href="../styles/navbar.css" />
    <!-- Add Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-auth.js"></script>
    <script src="../scripts/firebase-init.js"></script>

    <script>
      // Function to check if a user is logged in or not
      function checkAuthState() {
        firebase.auth().onAuthStateChanged(function(user) {
          if (!user) {
            // User is not signed in, redirect to the login page
            window.location.href = "login.html";
          }
        });
      }

      // Function to log out the user
      function logout() {
        firebase.auth().signOut().then(function() {
          // Sign-out successful, redirect to login page
          window.location.href = "login.html";
        }).catch(function(error) {
          // Handle errors here
          console.error("Logout error:", error);
        });
      }
    </script>
  
</head>

<body onload="checkAuthState()">
  <div id="navbar"></div> <!-- Placeholder for the navbar -->
  <div class="flexCenter" id="clock"></div>
  <div class="flexCenter" id="date">
    <span id="date"></span>
  </div>

  <div class="search-bar">
    <form action="https://www.google.com/search" method="get" target="_blank">
      <input type="text" name="q" placeholder="Search Google">
      <button class="search-bar button" type="submit">Search</button>
    </form>
  </div>

  <!-- App Version Display -->
  <div style="position: fixed; bottom: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; padding: 4px 8px; border-radius: 4px; font-size: 11px; z-index: 1000;">
    v2.1.0
  </div>

  <script src="../scripts/script.js"></script>
  <script src="../scripts/clock.js"></script>
  <script src="../scripts/loadNavbar.js"></script> <!-- Add script to load navbar -->
  
  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('../sw.js')
          .then(function(registration) {
            console.log('PWA Service Worker registered successfully:', registration.scope);
          }, function(err) {
            console.log('PWA Service Worker registration failed: ', err);
          });
      });
    }
  </script>
</body>

</html>
