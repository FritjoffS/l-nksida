<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta author="Fredrik Söderberg" />
  <title>Home</title>
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/date_time.css" />
  <link rel="stylesheet" href="../styles/search.css" />
  <link rel="stylesheet" href="../styles/navbar.css" />
</head>

<body>
  <div id="login-container" class="flexCenter">
    <form id="login-form">
      <h2>Login</h2>
      <input type="text" id="username" placeholder="Username" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Login</button>
      <p id="login-error" style="color: red; display: none;">Invalid username or password</p>
    </form>
  </div>

  <div id="content" style="display: none;">
    <div id="navbar"></div> <!-- Placeholder for the navbar -->
    <div class="flexCenter" id="clock"></div>
    <div class="flexCenter" id="date">
      <span id="date"></span>
    </div>

    <div class="search-bar">
      <form action="https://www.google.com/search" method="get" target="_blank">
        <input type="text" name="q" placeholder="Search Google">
        <button class="search-bar button" type="submit">Search</button>
      </form>
    </div>
  </div>

  <script src="../scripts/script.js"></script>
  <script src="../scripts/clock.js"></script>
  <script src="../scripts/loadNavbar.js"></script>
  <script src="../scripts/login.js"></script> <!-- Add login script -->
</body>

</html>
