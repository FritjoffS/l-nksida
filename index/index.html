<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Fredrik Söderberg" />
  <meta name="description" content="Inloggningssida" />
  <title>Home</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#ff6600" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Järnhandel" />
  <link rel="apple-touch-icon" href="../logo.png" />
  
  <!-- Windows/Desktop specifika ikoner -->
  <link rel="icon" type="image/png" sizes="32x32" href="../logo.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="../logo.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="../logo.png" />
  <link rel="icon" type="image/png" sizes="144x144" href="../logo.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="../logo.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="../logo.png" />
  <link rel="shortcut icon" href="../logo.png" />
  
  <!-- Windows specifika meta tags -->
  <meta name="msapplication-TileImage" content="../logo.png" />
  <meta name="msapplication-TileColor" content="#ff6600" />
  
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/date_time.css" />
  <link rel="stylesheet" href="../styles/search.css" />
  <link rel="stylesheet" href="../styles/navbar.css" />
  
  <style>
    /* Loading overlay */
    #loadingOverlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    
    #loadingOverlay .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid #ff6600;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }
    
    #loadingOverlay p {
      color: white;
      margin-top: 20px;
      font-size: 16px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <!-- Loading overlay -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <p>Kontrollerar autentisering...</p>
  </div>
  
  <div id="navbar"></div> <!-- Placeholder for the navbar -->
  <div class="flexCenter" id="clock"></div>
  <div class="flexCenter" id="date"></div>

  <div class="search-bar">
    <form action="https://www.google.com/search" method="get" target="_blank" rel="noopener noreferrer">
      <input type="text" name="q" placeholder="Search Google">
      <button class="search-bar button" type="submit">Search</button>
    </form>
  </div>

  <!-- App Version Display -->
  <div style="position: fixed; bottom: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; padding: 4px 8px; border-radius: 4px; font-size: 11px; z-index: 1000;">
    v2.1.1
  </div>

  <script type="module" src="index.js"></script>
  <script src="../scripts/script.js"></script>
  <script src="../scripts/clock.js"></script>
  <script src="../scripts/loadNavbar.js"></script>
  
  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('../sw.js')
          .then(function(registration) {
            console.log('PWA Service Worker registered successfully:', registration.scope);
          }, function(err) {
            console.log('PWA Service Worker registration failed: ', err);
          });
      });
    }
  </script>
</body>

</html>
