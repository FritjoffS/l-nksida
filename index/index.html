<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Fredrik Söderberg" />
  <meta name="description" content="Inloggningssida" />
  <title>Home</title>

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#ff6600" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Järnhandel" />
  <link rel="apple-touch-icon" href="../logo.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="Järnhandel" />

  <!-- Windows/Desktop specifika ikoner -->
  <link rel="icon" type="image/png" sizes="32x32" href="../logo.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="../logo.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="../logo.png" />
  <link rel="icon" type="image/png" sizes="144x144" href="../logo.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="../logo.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="../logo.png" />
  <link rel="shortcut icon" href="../logo.png" />

  <!-- Windows specifika meta tags -->
  <meta name="msapplication-TileImage" content="../logo.png" />
  <meta name="msapplication-TileColor" content="#ff6600" />

  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/date_time.css" />
  <link rel="stylesheet" href="../styles/search.css" />
  <link rel="stylesheet" href="../styles/navbar.css" />
  <link rel="stylesheet" href="../styles/index.css" />
</head>

  <!-- Google Analytics -->
  <script type="module" src="../scripts/analytics.js" async></script>
</head>

<body>
  <!-- Loading overlay -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <p>Kontrollerar autentisering...</p>
  </div>

  <!-- PWA Install Banner -->
  <div id="installBanner" style="display: none;">
    <div class="install-content">
      <span class="install-icon">📦</span>
      <div class="install-text">
        <strong>Installera appen</strong>
        <p>Installera Sollebrunns Järnhandel för snabbare åtkomst</p>
      </div>
      <button id="installButton" class="install-btn">Installera</button>
      <button id="dismissInstall" class="dismiss-btn" aria-label="Stäng installationsbanner">×</button>
    </div>
  </div>

  <div id="navbar" role="navigation" aria-label="Huvudnavigering"></div>

  <main role="main">
    <div class="flexCenter" id="clock" role="timer" aria-live="off" aria-label="Aktuell tid"></div>
    <div class="flexCenter" id="date" aria-live="off" aria-label="Dagens datum"></div>

    <div class="search-bar" role="search">
      <form action="https://www.google.com/search" method="get" target="_blank" rel="noopener noreferrer">
        <label for="searchInput" class="sr-only">Sök på Google</label>
        <input type="text" id="searchInput" name="q" placeholder="Search Google" aria-label="Sökfält för Google">
        <button class="search-bar button" type="submit" aria-label="Sök">Search</button>
      </form>
    </div>
  </main>

  <script type="module" src="index.js"></script>
  <script src="../scripts/script.js"></script>
  <script src="../scripts/clock.js"></script>
  <script src="../scripts/loadNavbar.js"></script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('../sw.js')
          .then(function (registration) {
            console.log('[PWA] Service Worker registered:', registration.scope);

            // Check for updates
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              console.log('[PWA] New Service Worker found');

              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // New service worker available, auto-update
                  console.log('[PWA] Update available, auto-updating...');
                  newWorker.postMessage({ type: 'SKIP_WAITING' });
                  window.location.reload();
                }
              });
            });
          })
          .catch(function (err) {
            console.error('[PWA] Service Worker registration failed:', err);
          });

        // Reload page when new service worker takes control
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            console.log('[PWA] New Service Worker activated, reloading...');
            window.location.reload();
          }
        });
      });
    }
  </script>
</body>

</html>
