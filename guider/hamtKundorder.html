<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Fredrik Söderberg">
    <title>Hämta Kundorder</title>
    <link rel="stylesheet" href="guide_styles.css">
    <link rel="stylesheet" href="../styles/navbar.css" />
    <!-- Add Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-database.js"></script>

    <script>
        // Initialize Firebase
        var firebaseConfig = {
            apiKey: "AIzaSyDOFeJ1GvtXtffzCwQFg2M3CCVtpn875KQ",
            authDomain: "l-nksida.firebaseapp.com",
            databaseURL: "https://l-nksida-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "l-nksida",
            storageBucket: "l-nksida.firebasestorage.app",
            messagingSenderId: "258147870107",
            appId: "1:258147870107:web:ce637517bc30b7578cad3e"
        };
        firebase.initializeApp(firebaseConfig);

        // Function to check if a user is logged in or not
        function checkAuthState() {
            firebase.auth().onAuthStateChanged(function (user) {
                if (!user) {
                    // User is not signed in, redirect to the login page
                    window.location.href = "../index/login.html";
                }
            });
        }

        // Function to load guide steps from Firebase
        function loadGuideSteps() {
            const database = firebase.database();
            const stepsContainer = document.getElementById("stepsContainer");

            database.ref("guider/hamtKundorderGuide/steps").once("value").then(snapshot => {
                if (snapshot.exists()) {
                    // Clear existing content
                    stepsContainer.innerHTML = "";
                    
                    // Sort steps by key for consistent order
                    const steps = [];
                    snapshot.forEach(childSnapshot => {
                        steps.push({
                            key: childSnapshot.key,
                            data: childSnapshot.val()
                        });
                    });
                    
                    steps.sort((a, b) => a.key.localeCompare(b.key));
                    
                    // Create sections for each step
                    steps.forEach(step => {
                        const stepData = step.data;
                        const section = document.createElement("section");
                        section.className = "guide-step";
                        
                        // Convert line breaks to HTML breaks to preserve formatting
                        const formattedText = (stepData.text || '').replace(/\n/g, '<br>');
                        let sectionContent = `<p style="white-space: pre-wrap;">${formattedText}</p>`;
                        
                        if (stepData.imageUrl) {
                            sectionContent += `
                                <img src="${stepData.imageUrl}" 
                                     alt="${stepData.altText || stepData.title || ''}" 
                                     title="${stepData.altText || stepData.title || ''}" 
                                     width="auto" 
                                     loading="eager">
                            `;
                        }
                        
                        sectionContent += `
                            <p>
                                ------------------------------------------------------------------------------------------
                            </p>
                        `;
                        
                        section.innerHTML = sectionContent;
                        stepsContainer.appendChild(section);
                    });
                } else {
                    // If no data exists, show default content
                    loadDefaultContent();
                }
            }).catch(error => {
                console.error("Error loading guide steps:", error);
                loadDefaultContent();
            });
        }

        // Function to load default content if no Firebase data exists
        function loadDefaultContent() {
            const stepsContainer = document.getElementById("stepsContainer");
            stepsContainer.innerHTML = `
                <section class="arkiv-hamta">
                    <p>
                        I utleveransfönstret, välj Arkiv, Hämta kundorder.
                    </p>
                    <img src="img/hamta1.png" alt="Arkiv-Hämta Kundorder" title="Arkiv-Hämta kundorder" width="auto" loading="eager">
                    <p>
                        ------------------------------------------------------------------------------------------
                    </p>
                </section>

                <section class="ordernummer">
                    <p>
                        I sökdialogen, skriv i Ordernumret 40xxxx och tryck Enter.
                    </p>
                    <img src="img/hamta2.png" alt="Skriv in ordernummer" title="Skriv in ordernummer" width="auto" loading="eager">
                    <p>
                        ------------------------------------------------------------------------------------------
                    </p>
                </section>

                <section class="kundorder">
                    <p>
                        Sökresltatet kommer upp i ett nytt fönster. Tryck Enter för att välja kundorder.
                    </p>
                    <img src="img/hamta3.png" alt="Välj kundorder" title="Välj kundorder" width="auto" loading="eager">
                    <p>
                        ------------------------------------------------------------------------------------------
                    </p>
                </section>

                <section class="plockat">
                    <p>
                        Rutan "Plockat av" kommer upp, välj i rullisten och klicka på ok.
                    </p>
                    <img src="img/hamta4.png" alt="Plockat av" title="Plockat Av" width="auto" loading="eager">
                    <p>
                        ------------------------------------------------------------------------------------------
                    </p>
                </section>

                <section class="utleverans">
                    <p>
                        Ordern öppnas nu i Utleveransen. <br>
                        Om något på ordern skall restas, sätt då 0 i antalet, det hamnar då på restorder. <br>
                        När du är klar genomför du köpet, alternativt sparar den som förjesedel. <br>
                        OBS! Kontrollera att du har kundens kundnummer om den skall faktureras.
                    </p>
                    <img src="img/hamta5.png" alt="Utleverans" title="Utleverans" width="auto" loading="eager">
                    <p>
                        ------------------------------------------------------------------------------------------
                    </p>
                </section>
            `;
        }

        // Load guide steps on page load
        window.onload = function () {
            checkAuthState();
            loadGuideSteps();
        };
    </script>
</head>

<body>

    <div id="navbar"></div> <!-- Placeholder for the navbar -->

    <main>
        <section class="center-bg">

            <h1>
                HÄMTA KUNDORDER
            </h1>

            <div id="stepsContainer">
                <!-- Dynamic content will be loaded here -->
            </div>

        </section>

    </main>

    <script src="../scripts/loadNavbar.js"></script> <!-- Add script to load navbar -->

</body>

</html>
