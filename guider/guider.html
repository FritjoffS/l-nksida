<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <title>Guider</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/navbar.css">
    <link rel="stylesheet" href="guide_styles.css">
    <link rel="stylesheet" href="../styles/products.css"> <!-- Återanvänder produktstilar -->

    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-database.js"></script>
    <script src="../scripts/firebase-config.js"></script>

</head>

<body>

    <div id="navbar"></div>

    <div class="filter-section">
        <input type="text" id="searchInput" placeholder="Sök efter guide...">
        <button class="add-product-btn" onclick="openAddGuideModal()" title="Lägg till ny guide">
            ➕ Lägg till guide
        </button>
    </div>

    <div id="guideContainer" class="product-grid"></div>

    <div id="loadingIndicator" style="text-align: center; padding: 20px;">
        <p>Laddar guider...</p>
    </div>

    <!-- Add/Edit Guide Modal -->
    <div class="modal" id="guideModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Lägg till ny guide</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="guideForm" onsubmit="saveGuide(event)">
                <input type="hidden" id="guideId">
                <div class="form-group">
                    <label for="guideName">Namn *</label>
                    <input type="text" id="guideName" required>
                </div>
                <div class="form-group">
                    <label for="guideDescription">Beskrivning</label>
                    <textarea id="guideDescription"></textarea>
                </div>
                <div class="form-group">
                    <label for="guideCategory">Kategori</label>
                    <input type="text" id="guideCategory" placeholder="T.ex. Verkstad, Kassa">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Avbryt</button>
                    <button type="submit" class="btn btn-success">Spara</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="guider.js"></script>
    <script src="../scripts/loadNavbar.js"></script>
</body>

</html>
