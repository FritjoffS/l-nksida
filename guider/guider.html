<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guider</title>
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/navbar.css" />
  <link rel="stylesheet" href="../styles/kontor-buttons.css" />
   <!-- Add Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-database.js"></script>

  <script>
    // Initialize Firebase with your project's config
    var firebaseConfig = {
      apiKey: "AIzaSyDOFeJ1GvtXtffzCwQFg2M3CCVtpn875KQ",
      authDomain: "l-nksida.firebaseapp.com",
      databaseURL: "https://l-nksida-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "l-nksida",
      storageBucket: "l-nksida.firebasestorage.app",
      messagingSenderId: "258147870107",
      appId: "1:258147870107:web:ce637517bc30b7578cad3e"
    };
    firebase.initializeApp(firebaseConfig);

    // Function to check if a user is logged in or not
    function checkAuthState() {
      console.log("Checking auth state...");
      firebase.auth().onAuthStateChanged(function (user) {
        if (!user) {
          console.log("User not authenticated, redirecting to login");
          // User is not signed in, redirect to the login page
          window.location.href = "../index/login.html";
        } else {
          console.log("User is authenticated:", user.email);
          // User is signed in, load guide buttons
          loadGuideButtons();
        }
      });
    }

    // Function to generate default display name from guide ID
    function getDefaultDisplayName(guideId) {
      // Default mapping for backward compatibility
      const defaultNames = {
        'hamtKundorderGuide': 'Hämta Kundorder',
        'prisuppdateringGuide': 'Prisuppdatering',
        'skapaKundorderGuide': 'Skapa Kundorder'
      };
      
      return defaultNames[guideId] || guideId.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase());
    }

    // Function to navigate to URL
    function navigateToUrl(url) {
      window.location.href = url;
    }

    // Function to load guide buttons dynamically
    function loadGuideButtons() {
      const database = firebase.database();
      const container = document.querySelector(".container");

      console.log("Loading guide buttons...");
      
      database.ref("guider").once("value").then(snapshot => {
        console.log("Firebase guides response received:", snapshot.exists());
        if (snapshot.exists()) {
          console.log("Guides found in database");
          
          // Clear existing content
          container.innerHTML = "";
          
          // Collect guides and sort them
          const guides = [];
          snapshot.forEach(childSnapshot => {
            const guideId = childSnapshot.key;
            const guideData = childSnapshot.val();
            
            if (guideData && guideData.steps) {
              guides.push({
                id: guideId,
                data: guideData,
                displayName: guideData.displayName || getDefaultDisplayName(guideId)
              });
            }
          });
          
          // Sort guides alphabetically by display name
          guides.sort((a, b) => a.displayName.localeCompare(b.displayName));
          
          // Create buttons for each guide
          guides.forEach(guide => {
            console.log("Creating button for guide:", guide.id);
            const button = document.createElement("button");
            button.className = "linkButton guide-button";
            button.innerHTML = guide.displayName;
            button.title = `Öppna guide: ${guide.displayName}`;
            button.onclick = () => navigateToUrl(`guide.html?guide=${guide.id}`);
            container.appendChild(button);
          });
          
          if (guides.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: #666; font-size: 18px; margin-top: 50px;">Inga guider tillgängliga för tillfället.</p>';
          }
        } else {
          console.log("No guides found in database");
          container.innerHTML = '<p style="text-align: center; color: #666; font-size: 18px; margin-top: 50px;">Inga guider tillgängliga för tillfället.</p>';
        }
      }).catch(error => {
        console.error("Error loading guides:", error);
        container.innerHTML = '<p style="text-align: center; color: #ff0000; font-size: 18px; margin-top: 50px;">Fel vid laddning av guider. Försök igen senare.</p>';
      });
    }

    // Load page on page load
    window.onload = function () {
      console.log("Guides page loaded, initializing...");
      checkAuthState();
    };
  </script>
</head>

<body onload="checkAuthState()">

  <div id="navbar"></div> <!-- Placeholder for the navbar -->

  <div class="container">
    <!-- Dynamic guide buttons will be loaded here -->
  </div>
  
  <script src="../scripts/script.js"></script>
  <script src="../scripts/loadNavbar.js"></script> <!-- Add script to load navbar -->
</body>

</html>
