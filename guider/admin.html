<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Hämta Kundorder Guide</title>
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../arbetsbeskrivningar/styles.css" />
  <link rel="stylesheet" href="../styles/navbar.css" />
  <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-database.js"></script>

  <style>
    .topContainer input[type="text"],
    .topContainer textarea {
      width: 100%;
      padding: 10px;
      margin: 5px 0 15px 0;
      font-size: 1rem;
      border-top: 2px solid lightgray;
      border-left: 2px solid lightgray;
      border-right: 2px solid darkgray;
      border-bottom: 2px solid darkgray;
      box-sizing: border-box;
    }
    
    .topContainer textarea {
      height: 100px;
      resize: vertical;
    }
    
    .topContainer label {
      display: block;
      margin: 10px 0 5px 0;
      font-size: 1.1rem;
      color: #333;
      font-weight: bold;
    }
    
    .topContainer button {
      margin: 10px 5px;
    }
    
    /* Preserve text formatting in textareas and previews */
    .topContainer textarea,
    #editModal textarea {
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: Arial, sans-serif;
    }
  </style>

  <script>
    // Initialize Firebase
    var firebaseConfig = {
      apiKey: "AIzaSyDOFeJ1GvtXtffzCwQFg2M3CCVtpn875KQ",
      authDomain: "l-nksida.firebaseapp.com",
      databaseURL: "https://l-nksida-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "l-nksida",
      storageBucket: "l-nksida.firebasestorage.app",
      messagingSenderId: "258147870107",
      appId: "1:258147870107:web:ce637517bc30b7578cad3e"
    };
    firebase.initializeApp(firebaseConfig);

    // Function to check if a user is logged in or not
    function checkAuthState() {
      firebase.auth().onAuthStateChanged(function (user) {
        if (!user) {
          // User is not signed in, redirect to the login page
          window.location.href = "../index/login.html";
        }
      });
    }

    // Function to fetch and display all database entries
    function loadEntries() {
      const database = firebase.database();
      const tableBody = document.getElementById("entriesTableBody");
      tableBody.innerHTML = ""; // Clear existing rows

      database.ref("guider/hamtKundorderGuide/steps").once("value").then(snapshot => {
        if (snapshot.exists()) {
          snapshot.forEach(childSnapshot => {
            const key = childSnapshot.key;
            const data = childSnapshot.val();
            
            const row = document.createElement("tr");
            row.innerHTML = `
              <td>${key}</td>
              <td>${data.title || 'Ingen titel'}</td>
              <td>
                <button onclick="editEntry('${key}')">Ändra Steg</button>
                <button onclick="deleteEntry('${key}')">Radera Steg</button>
              </td>
            `;
            tableBody.appendChild(row);
          });
        }
      }).catch(error => {
        console.error("Error loading entries:", error);
      });
    }

    // Function to add a new entry
    function addEntry() {
      const stepId = document.getElementById("newStepId").value.trim();
      const title = document.getElementById("newTitle").value.trim();
      const text = document.getElementById("newText").value.trim();
      const imageUrl = document.getElementById("newImageUrl").value.trim();
      const altText = document.getElementById("newAltText").value.trim();

      if (stepId && title && text) {
        const database = firebase.database();
        const stepData = {
          title: title,
          text: text,
          imageUrl: imageUrl,
          altText: altText
        };

        database.ref("guider/hamtKundorderGuide/steps/" + stepId).set(stepData).then(() => {
          alert("Steg tillagt!");
          clearForm();
          loadEntries();
        }).catch(error => {
          console.error("Error adding entry:", error);
          alert("Fel vid tillägg av steg.");
        });
      } else {
        alert("Steg-ID, titel och text är obligatoriska.");
      }
    }

    // Function to clear the form
    function clearForm() {
      document.getElementById("newStepId").value = "";
      document.getElementById("newTitle").value = "";
      document.getElementById("newText").value = "";
      document.getElementById("newImageUrl").value = "";
      document.getElementById("newAltText").value = "";
    }

    // Function to delete an entry
    function deleteEntry(stepId) {
      if (confirm(`Är du säker på att du vill radera steget "${stepId}"?`)) {
        const database = firebase.database();
        database.ref("guider/hamtKundorderGuide/steps/" + stepId).remove().then(() => {
          alert("Steg raderat!");
          loadEntries();
        }).catch(error => {
          console.error("Error deleting entry:", error);
          alert("Fel vid radering av steg.");
        });
      }
    }

    let currentEditKey = null;

    function editEntry(stepId) {
      const database = firebase.database();

      // Fetch the current value from the database
      database.ref("guider/hamtKundorderGuide/steps/" + stepId).once("value").then(snapshot => {
        const currentData = snapshot.val();

        if (currentData) {
          // Show the modal and populate the input fields with the current data
          currentEditKey = stepId;
          document.getElementById("editStepId").value = stepId;
          document.getElementById("editTitle").value = currentData.title || "";
          document.getElementById("editText").value = currentData.text || "";
          document.getElementById("editImageUrl").value = currentData.imageUrl || "";
          document.getElementById("editAltText").value = currentData.altText || "";
          document.getElementById("editModal").style.display = "block";
          document.getElementById("modalOverlay").style.display = "block";
        }
      }).catch(error => {
        console.error("Error fetching current value for editing:", error);
      });
    }

    function saveEdit() {
      const newStepId = document.getElementById("editStepId").value.trim();
      const newTitle = document.getElementById("editTitle").value.trim();
      const newText = document.getElementById("editText").value.trim();
      const newImageUrl = document.getElementById("editImageUrl").value.trim();
      const newAltText = document.getElementById("editAltText").value.trim();

      if (currentEditKey && newStepId && newTitle && newText) {
        const database = firebase.database();
        const stepData = {
          title: newTitle,
          text: newText,
          imageUrl: newImageUrl,
          altText: newAltText
        };

        // If the step ID has changed, remove the old key and save the new key-value pair
        if (currentEditKey !== newStepId) {
          database.ref("guider/hamtKundorderGuide/steps/" + currentEditKey).remove().then(() => {
            database.ref("guider/hamtKundorderGuide/steps/" + newStepId).set(stepData).then(() => {
              alert("Steg uppdaterat!");
              closeModal();
              loadEntries();
            }).catch(error => {
              console.error("Error updating entry:", error);
            });
          }).catch(error => {
            console.error("Error removing old key:", error);
          });
        } else {
          // If the step ID hasn't changed, just update the data
          database.ref("guider/hamtKundorderGuide/steps/" + currentEditKey).set(stepData).then(() => {
            alert("Steg uppdaterat!");
            closeModal();
            loadEntries();
          }).catch(error => {
            console.error("Error updating entry:", error);
          });
        }
      } else {
        alert("Steg-ID, titel och text är obligatoriska.");
      }
    }

    function closeModal() {
      document.getElementById("editModal").style.display = "none";
      document.getElementById("modalOverlay").style.display = "none";
      currentEditKey = null;
    }

    // Load entries on page load
    window.onload = function() {
      checkAuthState();
      loadEntries();
    };
  </script>
</head>

<body>
  <div id="navbar"></div> <!-- Placeholder for the navbar -->

  <div class="mainContainer">

    <div class="container">

      <div class="innerContainer">

        <div class="topContainer">

          <h1>Hämta Kundorder Guide</h1>
          <h2>Administration</h2>

          <h2>Lägg Till Nytt Steg</h2>

          <div>
            <label for="newStepId">Steg-ID:</label>
            <br>
            <input type="text" id="newStepId" placeholder="t.ex. step1, step2..." />
            <br />
            
            <label for="newTitle">Titel:</label>
            <br>
            <input type="text" id="newTitle" placeholder="Steg titel" />
            <br />
            
            <label for="newText">Beskrivning:</label>
            <br>
            <textarea id="newText" placeholder="Steg beskrivning"></textarea>
            <br />
            
            <label for="newImageUrl">Bild URL:</label>
            <br>
            <input type="text" id="newImageUrl" placeholder="img/hamta1.png" />
            <br />
            
            <label for="newAltText">Alt text för bild:</label>
            <br>
            <input type="text" id="newAltText" placeholder="Beskrivning av bilden" />
            <br />
            
            <button onclick="addEntry()">Spara Steg</button>
            <button onclick="clearForm()">Rensa Formulär</button>
          </div>

        </div>

        <div class="bottomContainer">

          <h2>SPARADE STEG</h2>
          <table border="1">
            <thead>
              <tr>
                <th>Steg-ID</th>
                <th>Titel</th>
                <th>Åtgärder</th>
              </tr>
            </thead>
            <tbody id="entriesTableBody">
            </tbody>
          </table>

        </div>

      </div>

    </div>

  </div>

  <!-- Modal for editing text -->
  <div id="editModal">
    <h3>Redigera Steg</h3>
    
    <label for="editStepId">Steg-ID:</label>
    <input id="editStepId" type="text" />
    
    <label for="editTitle">Titel:</label>
    <input id="editTitle" type="text" />
    
    <label for="editText">Beskrivning:</label>
    <textarea id="editText"></textarea>
    
    <label for="editImageUrl">Bild URL:</label>
    <input id="editImageUrl" type="text" />
    
    <label for="editAltText">Alt text för bild:</label>
    <input id="editAltText" type="text" />
    
    <br />
    <button class="saveButton" onclick="saveEdit()">Spara</button>
    <button class="closeButton" onclick="closeModal()">Avbryt</button>
  </div>

  <div id="modalOverlay" onclick="closeModal()"></div>

  <script src="../scripts/loadNavbar.js"></script>

</body>

</html>
