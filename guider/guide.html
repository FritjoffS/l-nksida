<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Fredrik Söderberg">
    <title>Guide</title>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#ff6600" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Järnhandel" />
    <link rel="apple-touch-icon" href="../logo.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Järnhandel" />
    <link rel="icon" type="image/png" sizes="192x192" href="../images/logo_rund.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="../logo.png" />

    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/navbar.css">
    <link rel="stylesheet" href="../styles/link-app.css">
    <link rel="stylesheet" href="guide_styles.css">

    <!-- Cloudinary Upload Widget -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
</head>

<!-- Google Analytics -->
<script type="module" src="../scripts/analytics.js" async></script>

<body>
    <!-- Loading overlay -->
    <div id="loadingOverlay" role="alert" aria-live="polite">
        <div class="spinner"></div>
        <p>Laddar guide...</p>
    </div>

    <div id="navbar" role="navigation" aria-label="Huvudnavigering"></div>

    <main role="main">
        <!-- Breadcrumb / action bar -->
        <div class="action-bar guide-view-action-bar">
            <a href="guider.html" class="back-link">
                ← Tillbaka till Guider
            </a>
            <button class="add-link-btn" id="addStepBtn" title="Lägg till nytt steg">
                ➕ <span>Lägg till steg</span>
            </button>
        </div>

        <!-- Guide header -->
        <div class="guide-header">
            <h1 id="pageTitle">Guide</h1>
        </div>

        <!-- Steps container -->
        <div id="stepsContainer" class="guide-steps-container" role="list" aria-label="Guidesteg">
            <!-- Dynamic content loaded here -->
        </div>
    </main>

    <script type="module" src="guide-view.js"></script>
    <script src="../scripts/loadNavbar.js"></script>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('../sw.js')
                    .then(function (registration) {
                        console.log('[PWA] Service Worker registered:', registration.scope);

                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            console.log('[PWA] New Service Worker found');

                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    console.log('[PWA] Update available');
                                    if (confirm('En ny version är tillgänglig! Vill du uppdatera nu?')) {
                                        newWorker.postMessage({ type: 'SKIP_WAITING' });
                                        window.location.reload();
                                    }
                                }
                            });
                        });
                    })
                    .catch(function (err) {
                        console.error('[PWA] Service Worker registration failed:', err);
                    });

                let refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (!refreshing) {
                        refreshing = true;
                        console.log('[PWA] New Service Worker activated, reloading...');
                        window.location.reload();
                    }
                });
            });
        }
    </script>

</body>

</html>
