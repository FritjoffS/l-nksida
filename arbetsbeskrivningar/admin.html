<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Arbetsbeskrivningar</title>
  <!-- Adjusted relative paths -->
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../arbetsbeskrivningar/styles.css" />
  <link rel="stylesheet" href="../styles/navbar.css" />
  <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-database.js"></script>

  <script>
    // Initialize Firebase
    var firebaseConfig = {
      apiKey: "AIzaSyDOFeJ1GvtXtffzCwQFg2M3CCVtpn875KQ",
      authDomain: "l-nksida.firebaseapp.com",
      databaseURL: "https://l-nksida-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "l-nksida",
      storageBucket: "l-nksida.firebasestorage.app",
      messagingSenderId: "258147870107",
      appId: "1:258147870107:web:ce637517bc30b7578cad3e"
    };
    firebase.initializeApp(firebaseConfig);

    // Function to fetch and display all database entries
    function loadEntries() {
      const database = firebase.database();
      const tableBody = document.getElementById("entriesTableBody");
      tableBody.innerHTML = ""; // Clear existing rows

      database.ref("arbetsbeskr").once("value").then(snapshot => {
        snapshot.forEach(childSnapshot => {
          const key = childSnapshot.key;
          const data = childSnapshot.val();
          const value = data && data.label ? data.label : ""; // Ensure value is a string

          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${key}</td>
            <td>${value}</td>
            <td>
              <button onclick="editEntry('${key}', '${value.replace(/'/g, "\\'")}')">Edit</button>
              <button onclick="deleteEntry('${key}')">Delete</button>
            </td>
          `;
          tableBody.appendChild(row);
        });
      }).catch(error => {
        console.error("Error loading entries:", error);
      });
    }

    // Function to add a new entry
    function addEntry() {
      const key = document.getElementById("newKey").value.trim();
      const value = document.getElementById("newValue").value.trim();

      if (key && value) {
        const database = firebase.database();
        database.ref("arbetsbeskr/" + key).set(value).then(() => {
          alert("Entry added successfully!");
          loadEntries();
        }).catch(error => {
          console.error("Error adding entry:", error);
        });
      } else {
        alert("Both key and value are required.");
      }
    }

    // Function to delete an entry
    function deleteEntry(key) {
      if (confirm(`Are you sure you want to delete "${key}"?`)) {
        const database = firebase.database();
        database.ref("arbetsbeskr/" + key).remove().then(() => {
          alert("Entry deleted successfully!");
          loadEntries();
        }).catch(error => {
          console.error("Error deleting entry:", error);
        });
      }
    }

    let currentEditKey = null;

    function editEntry(key) {
      const database = firebase.database();

      // Fetch the current value from the database
      database.ref("arbetsbeskr/" + key).once("value").then(snapshot => {
        const currentValue = snapshot.val();

        // Show the modal and populate the input fields with the current key and value
        currentEditKey = key;
        document.getElementById("editKeyInput").value = key;
        document.getElementById("editTextarea").value = currentValue || "";
        document.getElementById("editModal").style.display = "block";
        document.getElementById("modalOverlay").style.display = "block";
      }).catch(error => {
        console.error("Error fetching current value for editing:", error);
      });
    }

    function saveEdit() {
      const newKey = document.getElementById("editKeyInput").value.trim();
      const newValue = document.getElementById("editTextarea").value.trim();

      if (currentEditKey && newKey && newValue) {
        const database = firebase.database();

        // If the key has changed, remove the old key and save the new key-value pair
        if (currentEditKey !== newKey) {
          database.ref("arbetsbeskr/" + currentEditKey).remove().then(() => {
            database.ref("arbetsbeskr/" + newKey).set(newValue).then(() => {
              alert("Entry updated successfully!");
              closeModal();
              loadEntries();
            }).catch(error => {
              console.error("Error updating entry:", error);
            });
          }).catch(error => {
            console.error("Error removing old key:", error);
          });
        } else {
          // If the key hasn't changed, just update the value
          database.ref("arbetsbeskr/" + currentEditKey).set(newValue).then(() => {
            alert("Entry updated successfully!");
            closeModal();
            loadEntries();
          }).catch(error => {
            console.error("Error updating entry:", error);
          });
        }
      }
    }

    function closeModal() {
      document.getElementById("editModal").style.display = "none";
      document.getElementById("modalOverlay").style.display = "none";
      currentEditKey = null;
    }

    // Load entries on page load
    window.onload = loadEntries;
  </script>
</head>

<body>
  <div id="navbar"></div> <!-- Placeholder for the navbar -->

  <div class="mainContainer">

  <div class="container">

    <div class="innerContainer">

      <h1>Admin - Arbetsbeskrivningar</h1>

      <h2>Add New Entry</h2>
      <div>
        <label for="newKey">Key:</label>
        <input type="text" id="newKey" placeholder="Enter key" />
        <br />
        <label for="newValue">Value:</label>
        <textarea id="newValue" placeholder="Enter value"></textarea>
        <br />
        <button onclick="addEntry()">Add Entry</button>
      </div>

      <h2>Existing Entries</h2>
      <table border="1">
        <thead>
          <tr>
            <th>Key</th>
            <th>Value</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="entriesTableBody">
          <!-- Entries will be dynamically loaded here -->
        </tbody>
      </table>

      </div>

    </div>

  </div>

  <!-- Modal for editing text -->
  <div id="editModal"
    style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border: 1px solid #ccc; z-index: 1000; width: 600px; height: 450px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);">
    <h3>Edit Entry</h3>
    <label for="editKeyInput">Key:</label>
    <input id="editKeyInput" type="text" style="width: 100%; margin-bottom: 10px;" />
    <label for="editTextarea">Value:</label>
    <textarea id="editTextarea" style="width: 100%; height: 300px; font-size: 16px;"></textarea>
    <br />
    <button onclick="saveEdit()">Save</button>
    <button onclick="closeModal()">Cancel</button>
  </div>
  <div id="modalOverlay"
    style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 999;"
    onclick="closeModal()"></div>

  <script src="../scripts/loadNavbar.js"></script> <!-- Add script to load navbar -->

</body>

</html>
