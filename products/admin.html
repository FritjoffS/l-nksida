<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Products</title>
  <!-- <link rel="stylesheet" href="../styles/global.css" /> -->
  <link rel="stylesheet" href="../styles/navbar.css" />
  <link rel="stylesheet" href="../styles/admin.css" />
  <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-database.js"></script>

  <script>
    // Initialize Firebase
    var firebaseConfig = {
      apiKey: "AIzaSyDOFeJ1GvtXtffzCwQFg2M3CCVtpn875KQ",
      authDomain: "l-nksida.firebaseapp.com",
      databaseURL: "https://l-nksida-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "l-nksida",
      storageBucket: "l-nksida.firebasestorage.app",
      messagingSenderId: "258147870107",
      appId: "1:258147870107:web:ce637517bc30b7578cad3e"
    };
    firebase.initializeApp(firebaseConfig);

    // Function to fetch and display all products
    function loadProducts() {
      const database = firebase.database();
      const tableBody = document.getElementById("productsTableBody");
      tableBody.innerHTML = ""; // Clear existing rows

      database.ref("products").once("value").then(snapshot => {
        snapshot.forEach(childSnapshot => {
          const key = childSnapshot.key;
          const product = childSnapshot.val();

          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${key}</td>
            <td>${product.brand}</td>
            <td>${product.name}</td>
            <td>${product.category || ""}</td>
            <td>${product.subcategory || ""}</td>
            <td>${product.subtype || ""}</td>
            <td>
              <button onclick="editProduct('${key}')">Edit</button>
              <button onclick="deleteProduct('${key}')">Delete</button>
            </td>
          `;
          tableBody.appendChild(row);
        });
      }).catch(error => {
        console.error("Error loading products:", error);
      });
    }

    // Function to add a new product
    function addProduct() {

      const key = document.getElementById("newKey").value.trim();
      const brand = document.getElementById("newBrand").value.trim();
      const name = document.getElementById("newName").value.trim();
      const category = document.getElementById("newCategory").value.trim();
      const subcategory = document.getElementById("newSubcategory").value.trim();
      const subtype = document.getElementById("newSubtype").value.trim();

      if (key && name && category) {
        const database = firebase.database();
        database.ref("products/" + key).set({
          name,
          category,
          subcategory,
          subtype
        }).then(() => {
          alert("Product added successfully!");
          loadProducts();
        }).catch(error => {
          console.error("Error adding product:", error);
        });
      } else {
        alert("Key, Name, and Category are required.");
      }
    }

    // Function to delete a product
    function deleteProduct(key) {
      if (confirm(`Are you sure you want to delete "${key}"?`)) {
        const database = firebase.database();
        database.ref("products/" + key).remove().then(() => {
          alert("Product deleted successfully!");
          loadProducts();
        }).catch(error => {
          console.error("Error deleting product:", error);
        });
      }
    }

    let currentEditKey = null;

    // Function to edit a product
    function editProduct(key) {
      const database = firebase.database();

      // Fetch the current product data
      database.ref("products/" + key).once("value").then(snapshot => {
        const product = snapshot.val();

        // Populate the modal with the current product data
        currentEditKey = key;
        document.getElementById("editKey").value = key;
        document.getElementById("editBrand").value = product.brand || "";
        document.getElementById("editName").value = product.name || "";
        document.getElementById("editCategory").value = product.category || "";
        document.getElementById("editSubcategory").value = product.subcategory || "";
        document.getElementById("editSubtype").value = product.subtype || "";
        document.getElementById("editModal").style.display = "block";
        document.getElementById("modalOverlay").style.display = "block";
      }).catch(error => {
        console.error("Error fetching product for editing:", error);
      });
    }

    // Function to save the edited product
    function saveEdit() {
      const key = document.getElementById("editKey").value.trim();
      const brand = document.getElementById("editBrand").value.trim();
      const name = document.getElementById("editName").value.trim();
      const category = document.getElementById("editCategory").value.trim();
      const subcategory = document.getElementById("editSubcategory").value.trim();
      const subtype = document.getElementById("editSubtype").value.trim();

      if (currentEditKey && key && name && category) {
        const database = firebase.database();

        // Update the product data
        database.ref("products/" + currentEditKey).remove().then(() => {
          database.ref("products/" + key).set({
            brand,
            name,
            category,
            subcategory,
            subtype
          }).then(() => {
            alert("Product updated successfully!");
            closeModal();
            loadProducts();
          }).catch(error => {
            console.error("Error updating product:", error);
          });
        }).catch(error => {
          console.error("Error removing old product key:", error);
        });
      }
    }

    // Function to close the modal
    function closeModal() {
      document.getElementById("editModal").style.display = "none";
      document.getElementById("modalOverlay").style.display = "none";
      currentEditKey = null;
    }

    // Load products on page load
    window.onload = loadProducts;
  </script>
</head>

<body>
  <div id="navbar"></div> <!-- Placeholder for the navbar -->

  <div class="mainContainer">
    <div class="container">
      <h1>Products Administration</h1>

      <h2>Add New Product</h2>
      <div>
        <label for="newKey">Key:</label>
        <input type="text" id="newKey" placeholder="Unique Key" />
        <label for="newBrand">Brand:</label>
        <input type="text" id="newBrand" placeholder="Unique Brand" />
        <label for="newName">Name:</label>
        <input type="text" id="newName" placeholder="Product Name" />
        <label for="newCategory">Category:</label>
        <input type="text" id="newCategory" placeholder="Category" />
        <label for="newSubcategory">Subcategory:</label>
        <input type="text" id="newSubcategory" placeholder="Subcategory" />
        <label for="newSubtype">Subtype:</label>
        <input type="text" id="newSubtype" placeholder="Subtype" />
        <button onclick="addProduct()">Add Product</button>
      </div>

      <h2>Existing Products</h2>
      <table border="1">
        <thead>
          <tr>
            <th>Key</th>
            <th>Brand</th>
            <th>Name</th>
            <th>Category</th>
            <th>Subcategory</th>
            <th>Subtype</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="productsTableBody">
          <!-- Products will be dynamically loaded here -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal for editing a product -->
  <div id="editModal">
    <h3>Edit Product</h3>
    <label for="editKey">Key:</label>
    <input id="editKey" type="text" />
    <label for="editBrand">Brand:</label>
    <input id="editBrand" type="text" />
    <label for="editName">Name:</label>
    <input id="editName" type="text" />
    <label for="editCategory">Category:</label>
    <input id="editCategory" type="text" />
    <label for="editSubcategory">Subcategory:</label>
    <input id="editSubcategory" type="text" />
    <label for="editSubtype">Subtype:</label>
    <input id="editSubtype" type="text" />
    <button onclick="saveEdit()">Save</button>
    <button onclick="closeModal()">Cancel</button>
  </div>

  <div id="modalOverlay" onclick="closeModal()"></div>

  <script src="../scripts/loadNavbar.js"></script> <!-- Add script to load navbar -->
</body>

</html>
