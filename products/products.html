<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <title>Produktsök - Lokal Databas</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/navbar.css">
    <link rel="stylesheet" href="../styles/products.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles.css">

    <script src="../scripts/loadNavbar.js"></script>

</head>

<body>


    <div id="navbar"></div> <!-- Placeholder for the navbar -->

    <div class="filter-section">
        <input type="text" id="searchInput" placeholder="Sök efter produkt eller artikelnummer...">
        <select id="mainCategory">
            <option value="">Alla Fabrikat</option>
        </select>

        <select id="subCategory" disabled>
            <option value="">Välj Produktkategori</option>
        </select>

        <select id="subType" disabled>
            <option value="">Välj underkategori</option>
        </select>

        <button class="add-product-btn" onclick="openAddProductModal()" title="Lägg till ny produkt">
            ➕ <span>Lägg till produkt</span>
        </button>
    </div>

    <div id="productContainer" class="product-grid"></div>

    <!-- Loading indicator -->
    <div id="loadingIndicator" style="text-align: center; padding: 20px;">
        <p>Laddar produkter...</p>
    </div>

    <!-- Edit Product Modal -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Redigera produkt</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="productForm" onsubmit="saveProduct(event)">
                <div class="form-group">
                    <label for="productCategory">Fabrikat *</label>
                    <div class="select-with-action">
                        <select id="productCategory" required onchange="updateModalSubcategories()">
                            <option value="">Välj Fabrikat</option>
                            <option value="__NEW__" style="color: #28a745; font-weight: bold;">➕ Nytt Fabrikat</option>
                        </select>
                        <button type="button" class="edit-icon-btn" id="editCategoryBtn" onclick="openEditCategory()" disabled title="Redigera fabrikat">
                            ✏️
                        </button>
                        <button type="button" class="edit-icon-btn" id="deleteCategoryBtn" onclick="deleteCategory()" disabled title="Ta bort fabrikat" style="color: #dc3545;">
                            🗑️
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="productSubcategory">Underkategori *</label>
                    <div class="select-with-action">
                        <select id="productSubcategory" required onchange="updateModalSubtypes()">
                            <option value="">Välj underkategori</option>
                            <option value="__NEW__" style="color: #28a745; font-weight: bold;">➕ Ny Underkategori</option>
                        </select>
                        <button type="button" class="edit-icon-btn" id="editSubcategoryBtn" onclick="openEditSubcategory()" disabled title="Redigera underkategori">
                            ✏️
                        </button>
                        <button type="button" class="edit-icon-btn" id="deleteSubcategoryBtn" onclick="deleteSubcategory()" disabled title="Ta bort underkategori" style="color: #dc3545;">
                            🗑️
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="productSubtype">Undertyp</label>
                    <div class="select-with-action">
                        <select id="productSubtype">
                            <option value="">Ingen undertyp</option>
                            <option value="__NEW__" style="color: #28a745; font-weight: bold;">➕ Ny Undertyp</option>
                        </select>
                        <button type="button" class="edit-icon-btn" id="editSubtypeBtn" onclick="openEditSubtype()" disabled title="Redigera undertyp">
                            ✏️
                        </button>
                        <button type="button" class="edit-icon-btn" id="deleteSubtypeBtn" onclick="deleteSubtype()" disabled title="Ta bort undertyp" style="color: #dc3545;">
                            🗑️
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="productNumber">Produktnummer *</label>
                    <input type="text" id="productNumber" required>
                </div>

                <div class="form-group">
                    <label for="productName">Produktnamn *</label>
                    <input type="text" id="productName" required>
                </div>

                <div class="form-group">
                    <label for="productInfo">Beskrivning *</label>
                    <textarea id="productInfo" required></textarea>
                </div>

                <div class="form-group">
                    <label for="productImage">Bildsökväg</label>
                    <input type="text" id="productImage" placeholder="images/category/product.png">
                </div>

                <div class="form-group">
                    <label for="productSpecs">Specifikationer</label>
                    <textarea id="productSpecs" placeholder="Fabrikat: Honda&#10;Storlek: Large&#10;Vikt: 5kg" rows="5"></textarea>
                    <small style="color: #666; display: block; margin-top: 5px;">Skriv en specifikation per rad i formatet: Nyckel: Värde</small>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Avbryt</button>
                    <button type="submit" class="btn btn-success">Spara</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Category Management Modals -->
    <div class="modal" id="categoryModal">
        <div class="modal-content small">
            <div class="modal-header">
                <h2 id="categoryModalTitle">Lägg till Fabrikat</h2>
                <button class="close-btn" onclick="closeCategoryModal()">&times;</button>
            </div>
            <form onsubmit="saveCategoryFromModal(event)">
                <div class="form-group">
                    <label for="modalCategoryName">Fabrikatnamn *</label>
                    <input type="text" id="modalCategoryName" required placeholder="t.ex. Honda">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeCategoryModal()">Avbryt</button>
                    <button type="submit" class="btn btn-success">Spara</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="subcategoryModal">
        <div class="modal-content small">
            <div class="modal-header">
                <h2 id="subcategoryModalTitle">Lägg till Underkategori</h2>
                <button class="close-btn" onclick="closeSubcategoryModal()">&times;</button>
            </div>
            <form onsubmit="saveSubcategoryFromModal(event)">
                <div class="form-group">
                    <label for="modalSubcategoryName">Underkategori *</label>
                    <input type="text" id="modalSubcategoryName" required placeholder="t.ex. Luftfilter">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeSubcategoryModal()">Avbryt</button>
                    <button type="submit" class="btn btn-success">Spara</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="subtypeModal">
        <div class="modal-content small">
            <div class="modal-header">
                <h2 id="subtypeModalTitle">Lägg till Undertyp</h2>
                <button class="close-btn" onclick="closeSubtypeModal()">&times;</button>
            </div>
            <form onsubmit="saveSubtypeFromModal(event)">
                <div class="form-group">
                    <label for="modalSubtypeName">Undertyp *</label>
                    <input type="text" id="modalSubtypeName" required placeholder="t.ex. Panel typ">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeSubtypeModal()">Avbryt</button>
                    <button type="submit" class="btn btn-success">Spara</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="products.js"></script>
</body>

</html>
