<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8">
  <title>Produktsök - Firebase Databas</title>
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="../styles/navbar.css">
  <link rel="stylesheet" href="../styles/products.css">

  <!-- Add Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-database.js"></script>

  <script>
    // Initialize Firebase with your project's config
    var firebaseConfig = {
      apiKey: "AIzaSyDOFeJ1GvtXtffzCwQFg2M3CCVtpn875KQ",
      authDomain: "l-nksida.firebaseapp.com",
      databaseURL: "https://l-nksida-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "l-nksida",
      storageBucket: "l-nksida.firebasestorage.app",
      messagingSenderId: "258147870107",
      appId: "1:258147870107:web:ce637517bc30b7578cad3e"
    };
    firebase.initializeApp(firebaseConfig);

    // Function to fetch and display products from Firebase
    function loadProducts() {
      const database = firebase.database();
      const container = document.getElementById("productContainer");
      container.innerHTML = ""; // Clear existing products

      database.ref("products").once("value").then(snapshot => {
        snapshot.forEach(childSnapshot => {
          const product = childSnapshot.val();

          // Create product card
          const productCard = document.createElement("div");
          productCard.className = "product-card";
          productCard.innerHTML = `
            <img src="${product.image}" class="product-image" alt="${product.name}">
            <div class="product-info">
              <h3>${product.name}</h3>
              <p class="product-number">produktnummer: ${product.productNumber}</p>
              <p>produkt info: ${product.info}</p>
              <div class="specs">specs
                ${Object.entries(product.specs || {}).map(([key, value]) => `
                  <p><strong>${key}:</strong> ${value}</p>
                `).join("")}
              </div>
            </div>
          `;
          container.appendChild(productCard);
        });
      }).catch(error => {
        console.error("Error loading products:", error);
      });
    }

    // Function to filter products dynamically
    function filterProducts() {
      const searchTerm = document.getElementById("searchInput").value.toLowerCase();
      const mainCategory = document.getElementById("mainCategory").value;
      const subCategory = document.getElementById("subCategory").value;
      const subType = document.getElementById("subType").value;

      const database = firebase.database();
      const container = document.getElementById("productContainer");
      container.innerHTML = ""; // Clear existing products

      database.ref("products").once("value").then(snapshot => {
        snapshot.forEach(childSnapshot => {
          const product = childSnapshot.val();

          const matchesSearch = product.name.toLowerCase().includes(searchTerm) ||
            product.productNumber.toLowerCase().includes(searchTerm) ||
            product.info.toLowerCase().includes(searchTerm) ||
            Object.values(product.specs || {}).some(spec => spec.toLowerCase().includes(searchTerm));

          const matchesCategory = !mainCategory || product.category === mainCategory;
          const matchesSubcategory = !subCategory || product.subcategory === subCategory;
          const matchesSubtype = !subType || product.subtype === subType;

          if (matchesSearch && matchesCategory && matchesSubcategory && matchesSubtype) {
            const productCard = document.createElement("div");
            productCard.className = "product-card";
            productCard.innerHTML = `
              <img src="${product.image}" class="product-image" alt="${product.name}">
              <div class="product-info">
                <h3>${product.name}</h3>
                <p class="product-number">${product.productNumber}</p>
                <p>${product.info}</p>
                <div class="specs">
                  ${Object.entries(product.specs || {}).map(([key, value]) => `
                    <p><strong>${key}:</strong> ${value}</p>
                  `).join("")}
                </div>
              </div>
            `;
            container.appendChild(productCard);
          }
        });
      }).catch(error => {
        console.error("Error filtering products:", error);
      });
    }

    // Load products on page load
    window.onload = function () {
      loadProducts();

      // Add event listeners for filtering
      document.getElementById("searchInput").addEventListener("input", filterProducts);
      document.getElementById("mainCategory").addEventListener("change", filterProducts);
      document.getElementById("subCategory").addEventListener("change", filterProducts);
      document.getElementById("subType").addEventListener("change", filterProducts);
    };
  </script>
</head>

<body>
  <div id="navbar"></div> <!-- Placeholder for the navbar -->

  <div class="filter-section">
    <input type="text" id="searchInput" placeholder="Sök efter produkt eller artikelnummer...">
    <select id="mainCategory">
      <option value="">Alla Fabrikat</option>
      <option value="Briggs & Stratton">Briggs & Stratton</option>
      <option value="Stiga">Stiga</option>
      <option value="Husqvarna">Husqvarna</option>
      <option value="Stihl">Stihl</option>
      <option value="Kohler">Kohler</option>
    </select>

    <select id="subCategory">
      <option value="">Välj Produktkategori</option>
    </select>

    <select id="subType">
      <option value="">Välj underkategori</option>
    </select>
  </div>

  <div id="productContainer" class="product-grid"></div>

  <script src="../scripts/loadNavbar.js"></script> <!-- Add script to load navbar -->
</body>

</html>
