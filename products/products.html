<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <title>Produktsök - Lokal Databas</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/navbar.css">
    <link rel="stylesheet" href="../styles/products.css">

    <!-- Add Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-auth.js"></script>
    <script src="../scripts/firebase-init.js"></script>

    <script>


        // Function to check if a user is logged in or not
        function checkAuthState() {
            firebase.auth().onAuthStateChanged(function (user) {
                if (!user) {
                    // User is not signed in, redirect to the login page
                    window.location.href = "../index/login.html";
                }
                console.log("User is signed in");
            });
        }

        // Function to log out the user
        function logout() {
            firebase.auth().signOut().then(function () {
                // Sign-out successful, redirect to login page
                window.location.href = "../index/login.html";
            }).catch(function (error) {
                // Handle errors here
                console.error("Logout error:", error);
            });
        }
    </script>

</head>

<body onload="checkAuthState()">


    <div id="navbar"></div> <!-- Placeholder for the navbar -->
    <div class="filter-section">
        <input type="text" id="searchInput" placeholder="Sök efter produkt eller artikelnummer...">
        <select id="mainCategory">
            <option value="">Alla Fabrikat</option>
            <option value="Briggs & Stratton">Briggs & Stratton</option>
            <option value="Stiga">Stiga</option>
            <option value="Husqvarna">Husqvarna</option>
            <!-- <option value="Klippo">Klippo</option> -->
            <option value="Honda">Honda</option>
            <option value="Kawasaki">Kawasaki</option>
            <option value="Stihl">Stihl</option>
            <option value="Kohler">Kohler</option>
            <option value="Övriga">Övriga</option>

        </select>

        <select id="subCategory" disabled>
            <option value="">Välj Produktkategori</option>
        </select>

        <select id="subType" disabled>
            <option value="">Välj underkategori</option>
        </select>
    </div>

    <div id="productContainer" class="product-grid"></div>

    <script src="../scripts/loadNavbar.js"></script> <!-- Add script to load navbar -->
    <script type="module">
        import productsDB from './productsDB.js';

        // Initiera gränssnittet
        function init() {
            document.getElementById('searchInput').addEventListener('input', updateResults);
            document.getElementById('mainCategory').addEventListener('change', updateSubcategories);
            document.getElementById('subCategory').addEventListener('change', updateSubtypes);
            document.getElementById('subType').addEventListener('change', updateResults);

            updateResults();
        }

        // Uppdatera underkategorier
        function updateSubcategories() {
            const mainCategory = document.getElementById('mainCategory').value;
            const subCategorySelect = document.getElementById('subCategory');
            subCategorySelect.innerHTML = '<option value="">Välj underkategori</option>';

            if (mainCategory) {
                const category = productsDB.categories.find(c => c.name === mainCategory);

                if (category && category.subgroups) {
                    category.subgroups.forEach(subgroup => {
                        const option = document.createElement('option');
                        option.value = subgroup.name;
                        option.textContent = subgroup.name;
                        subCategorySelect.appendChild(option);
                    });
                    subCategorySelect.disabled = false;
                } else {
                    subCategorySelect.disabled = true;
                }
            } else {
                subCategorySelect.disabled = true;
            }

            updateResults();
        }

        // Uppdatera undergrupper
        function updateSubtypes() {
            const mainCategory = document.getElementById('mainCategory').value;
            const subCategory = document.getElementById('subCategory').value;
            const subTypeSelect = document.getElementById('subType');
            subTypeSelect.innerHTML = '<option value="">Välj underkategori</option>';

            if (mainCategory && subCategory) {
                const category = productsDB.categories.find(c => c.name === mainCategory);
                const subgroup = category.subgroups.find(sg => sg.name === subCategory);

                if (subgroup && subgroup.subtypes) {
                    subgroup.subtypes.forEach(subtype => {
                        const option = document.createElement('option');
                        option.value = subtype;
                        option.textContent = subtype;
                        subTypeSelect.appendChild(option);
                    });
                    subTypeSelect.disabled = false;
                } else {
                    subTypeSelect.disabled = true;
                }
            } else {
                subTypeSelect.disabled = true;
            }

            updateResults();
        }

        // Filtrera produkter
        function filterProducts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const mainCategory = document.getElementById('mainCategory').value;
            const subCategory = document.getElementById('subCategory').value;
            const subType = document.getElementById('subType').value;

            return productsDB.categories.flatMap(category => {
                if (mainCategory && category.name !== mainCategory) return [];

                return category.products.filter(product => {
                    const matchesSearch = product.name.toLowerCase().includes(searchTerm) ||
                        product.productNumber.toLowerCase().includes(searchTerm) ||
                        product.info.toLowerCase().includes(searchTerm) ||
                        Object.values(product.specs).some(spec => spec.toLowerCase().includes(searchTerm));

                    const matchesSubcategory = !subCategory || product.subcategory === subCategory;
                    const matchesSubtype = !subType || product.subtype === subType;

                    return matchesSearch && matchesSubcategory && matchesSubtype;
                });
            });
        }

        // Uppdatera resultat
        function updateResults() {
            const filteredProducts = filterProducts();
            const container = document.getElementById('productContainer');

            if (filteredProducts.length === 0) {
                container.innerHTML = '<div class="no-results">Inga produkter hittades med aktuella filter</div>';
                return;
            }

            container.innerHTML = filteredProducts.map(product => `
                <div class="product-card">
                    <img src="${product.image}" class="product-image" alt="${product.name}">
                    <div class="product-info">
                        <h3>${product.name}</h3>
                        <div class="product-number-container" style="display: flex; align-items: center;">
                            <p class="product-number" style="margin-right: 8px;">${product.productNumber}</p>
                            <button class="copy-button" data-product-number="${product.productNumber}" style="background-image: url('../images/copy.jpg'); background-size: contain; background-repeat: no-repeat; width: 24px; height: 24px; border: none; cursor: pointer;"></button>
                        </div>                        
                        <p>${product.info}</p>
                        <div class="specs">
                            ${Object.entries(product.specs).map(([key, value]) => `
                                <p><strong>${key}:</strong> ${value}</p>
                            `).join('')}
                        </div>
                    </div>
                        
                    </div>
                </div>
            `).join('');

            // Lägg till event listeners för kopieringsknapparna
            document.querySelectorAll('.copy-button').forEach(button => {
                button.addEventListener('click', () => {
                    const productNumber = button.getAttribute('data-product-number');
                    copyTextToClipboard(productNumber);
                });
            });
        }

        // Funktion för att kopiera text till urklipp
        function copyTextToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                var message = document.createElement("div");
                message.textContent = "Produktnumret har kopierats";
                message.style.position = "fixed";
                message.style.backgroundColor = "#333";
                message.style.bottom = "10px";
                message.style.left = "50%";
                message.style.transform = "translateX(-50%)";
                message.style.color = "#fff";
                message.style.padding = "10px";
                message.style.borderRadius = "5px";
                message.style.zIndex = "1000";
                message.style.fontSize = "48px";
                message.style.transition = "opacity 1s";
                message.style.opacity = "1";

                document.body.appendChild(message);

                // Ta bort meddelandet efter 3 sekunder
                setTimeout(function () {
                    message.style.opacity = "0";
                    setTimeout(function () {
                        document.body.removeChild(message);
                    }, 1000); // Vänta på att övergången ska slutföras
                }, 3000);
            }).catch(function (err) {
                console.error('Kunde inte kopiera texten: ', err);
            });
        }

        // Starta applikationen
        init();
    </script>
</body>

</html>
