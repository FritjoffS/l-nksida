<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Produktsök - Lokal Databas</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
        }

        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f6fa;
        }

        .filter-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        select, input {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            padding: 20px 0;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: contain;
            background: #f8f9fa;
            padding: 15px;
        }

        .product-info {
            padding: 20px;
        }

        .product-number {
            color: #7f8c8d;
            font-size: 0.9em;
        }

        .no-results {
            text-align: center;
            padding: 50px;
            font-size: 1.2em;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="filter-section">
        <input type="text" id="searchInput" placeholder="Sök efter produkt eller artikelnummer...">
        <select id="mainCategory">
            <option value="">Alla huvudkategorier</option>
        </select>
        <select id="subCategory" disabled>
            <option value="">Välj underkategori</option>
        </select>
    </div>
    
    <div id="productContainer" class="product-grid"></div>

    <script>
        // Lokal produktdatabas
        const productsDB = {
            categories: [
                {
                    name: "Luftfilter",
                    subgroups: ["Panel typ", "Oval typ", "Rund typ", "Skum typ"],
                    products: [
                        {
                            name: "Stiga LF-200 Pro",
                            subcategory: "Panel typ",
                            image: "images/397795s.png",
                            info: "Professionellt luftfilter för tunga förhållanden",
                            productNumber: "STG-LF200-PRO",
                            specs: {
                                Dimensioner: "300x400x50 mm",
                                Material: "Syntetfiber",
                                Livslängd: "2000 timmar"
                            }
                        },
                        {
                            name: "Stiga LF-150 Basic",
                            subcategory: "Skum typ",
                            image: "placeholder-luftfilter2.jpg",
                            info: "Standardluftfilter för generellt bruk",
                            productNumber: "STG-LF150-BAS",
                            specs: {
                                Dimensioner: "250x350x40 mm",
                                Material: "Pappersfilter",
                                Livslängd: "1000 timmar"
                            }
                        }
                    ]
                },
                {
                    name: "Bränslefilter",
                    subgroups: ["Högflöde", "Standard", "Komposit"],
                    products: [
                        {
                            name: "Stiga BF-300 Diesel",
                            image: "placeholder-branslefilter.jpg",
                            info: "Avancerat dieselbränslefilter",
                            productNumber: "STG-BF300-DSL",
                            specs: {
                                Flödeshastighet: "200 l/h",
                                Filtrering: "5 µm",
                                Temperaturintervall: "-40°C till +120°C"
                            }
                        }
                    ]
                }
            ]
        };

        // Initiera gränssnittet
        function init() {
            const mainCategorySelect = document.getElementById('mainCategory');
            
            // Fyll huvudkategorier
            productsDB.categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category.name;
                option.textContent = category.name;
                mainCategorySelect.appendChild(option);
            });

            // Event listeners
            document.getElementById('searchInput').addEventListener('input', updateResults);
            mainCategorySelect.addEventListener('change', updateSubcategories);
            document.getElementById('subCategory').addEventListener('change', updateResults);
            
            updateResults();
        }

        // Uppdatera underkategorier
        function updateSubcategories() {
            const mainCategory = document.getElementById('mainCategory').value;
            const subCategorySelect = document.getElementById('subCategory');
            subCategorySelect.innerHTML = '<option value="">Välj underkategori</option>';
            
            if(mainCategory) {
                const category = productsDB.categories.find(c => c.name === mainCategory);
                category.subgroups.forEach(sub => {
                    const option = document.createElement('option');
                    option.value = sub;
                    option.textContent = sub;
                    subCategorySelect.appendChild(option);
                });
                subCategorySelect.disabled = false;
            } else {
                subCategorySelect.disabled = true;
            }
            
            updateResults();
        }

        // Filtrera produkter
        function filterProducts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const mainCategory = document.getElementById('mainCategory').value;
            const subCategory = document.getElementById('subCategory').value;

            return productsDB.categories.flatMap(category => {
                if(mainCategory && category.name !== mainCategory) return [];
                
                return category.products.filter(product => {
                    const matchesSearch = product.name.toLowerCase().includes(searchTerm) || 
                                        product.productNumber.toLowerCase().includes(searchTerm);
                    
                    const matchesSubcategory = !subCategory || 
                                             (category.subgroups.includes(subCategory));
                    
                    return matchesSearch && matchesSubcategory;
                });
            });
        }

        // Uppdatera resultat
        function updateResults() {
            const filteredProducts = filterProducts();
            const container = document.getElementById('productContainer');
            
            if(filteredProducts.length === 0) {
                container.innerHTML = '<div class="no-results">Inga produkter hittades med aktuella filter</div>';
                return;
            }

            container.innerHTML = filteredProducts.map(product => `
                <div class="product-card">
                    <img src="${product.image}" class="product-image" alt="${product.name}">
                    <div class="product-info">
                        <h3>${product.name}</h3>
                        <p class="product-number">${product.productNumber}</p>
                        <p>${product.info}</p>
                        <div class="specs">
                            ${Object.entries(product.specs).map(([key, value]) => `
                                <p><strong>${key}:</strong> ${value}</p>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Starta applikationen
        init();
    </script>
</body>
</html>
