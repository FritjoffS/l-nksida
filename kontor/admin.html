<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Kontor</title>
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/admin_styles.css" />
  <link rel="stylesheet" href="../styles/navbar.css" />

  <script type="module" src="admin.js"></script>
</head>

<body>
  <div id="navbar"></div> <!-- Placeholder for the navbar -->

  <div class="mainContainer">

    <div class="container">

      <div class="innerContainer">

        <div class="topContainer">

          <h1>Kontor</h1>
          <h2>Administration</h2>

          <h2>Lägg Till Ny Länk</h2>

          <div>
            <label for="newKey">Benämning:</label>
            <br>
            <input type="text" id="newKey" placeholder="T.ex. Fortnox" />
            <br />
            <label for="newValue">URL:</label>
            <br>
            <input type="url" id="newValue" placeholder="https://..." />
            <br />
            <button onclick="addEntry()">Spara Länk</button>
          </div>

        </div>

        <div class="bottomContainer">

          <h2>SPARADE LÄNKAR</h2>
          <table border="1">
            <thead>
              <tr>
                <th>Benämning</th>
                <th>URL</th>
                <th>Åtgärd</th>
              </tr>
            </thead>
            <tbody id="entriesTableBody">
              <!-- Entries will be dynamically loaded here -->
            </tbody>
          </table>

        </div>

      </div>

    </div>

  </div>

  <!-- Modal for editing link -->
  <div id="editModal" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
    <h3 id="editModalTitle">Redigera Kontorslänk</h3>
    <label for="editKeyInput">Benämning:</label>
    <input id="editKeyInput" type="text" />
    <label for="editTextarea">URL:</label>
    <input id="editTextarea" type="url" placeholder="https://..." />
    <br />
    <button class="saveButton" onclick="saveEdit()">Spara</button>
    <button class="closeButton" onclick="closeModal()">Avbryt</button>
  </div>

  <div id="modalOverlay" onclick="closeModal()"></div>

  <script src="../scripts/loadNavbar.js"></script> <!-- Add script to load navbar -->

</body>

</html>
