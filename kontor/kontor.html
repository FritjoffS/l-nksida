<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontor</title>
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/navbar.css" />
  <link rel="stylesheet" href="../styles/kontor-buttons.css" />
   <!-- Add Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-database.js"></script>

  <script>
    // Initialize Firebase with your project's config
    var firebaseConfig = {
      apiKey: "AIzaSyDOFeJ1GvtXtffzCwQFg2M3CCVtpn875KQ",
      authDomain: "l-nksida.firebaseapp.com",
      databaseURL: "https://l-nksida-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "l-nksida",
      storageBucket: "l-nksida.firebasestorage.app",
      messagingSenderId: "258147870107",
      appId: "1:258147870107:web:ce637517bc30b7578cad3e"
    };
    firebase.initializeApp(firebaseConfig);

    // Function to check if a user is logged in or not
    function checkAuthState() {
      console.log("Checking auth state...");
      firebase.auth().onAuthStateChanged(function (user) {
        if (!user) {
          console.log("User not authenticated, redirecting to login");
          // User is not signed in, redirect to the login page
          window.location.href = "../index/login.html";
        } else {
          console.log("User is authenticated:", user.email);
          // User is signed in, load content - kontor.js will handle loadButtons()
          loadGuideShortcuts();
        }
      });
    }

    // Function to log out the user
    function logout() {
      firebase.auth().signOut().then(function () {
        // Sign-out successful, redirect to login page
        window.location.href = "../index/login.html";
      }).catch(function (error) {
        // Handle errors here
        console.error("Logout error:", error);
      });
    }

    // Function to load guide shortcuts dynamically
    function loadGuideShortcuts() {
      const database = firebase.database();
      const container = document.querySelector(".container");

      // Guide display names
      const guideDisplayNames = {
        'hamtKundorderGuide': 'Hämta Kundorder',
        'prisuppdateringGuide': 'Prisuppdatering',
        'skapaKundorderGuide': 'Skapa Kundorder'
      };

      console.log("Loading guide shortcuts...");
      
      database.ref("guider").once("value").then(snapshot => {
        console.log("Firebase response received:", snapshot.exists());
        if (snapshot.exists()) {
          console.log("Guides found in database");
          snapshot.forEach(childSnapshot => {
            const guideId = childSnapshot.key;
            const guideData = childSnapshot.val();
            
            console.log("Processing guide:", guideId, guideData);
            
            // Only create button if guide has steps
            if (guideData && guideData.steps) {
              console.log("Creating button for guide:", guideId);
              const button = document.createElement("button");
              button.className = "linkButton guide-button";
              button.innerHTML = guideDisplayNames[guideId] || guideId;
              button.title = `Öppna guide: ${guideDisplayNames[guideId] || guideId}`;
              button.onclick = () => navigateToUrl(`../guider/guide.html?guide=${guideId}`);
              container.appendChild(button);
            } else {
              console.log("Guide has no steps:", guideId);
            }
          });
        } else {
          console.log("No guides found in database");
        }
      }).catch(error => {
        console.error("Error loading guides:", error);
      });
    }

    // Load page on page load
    window.onload = function () {
      console.log("Page loaded, initializing...");
      checkAuthState();
    };
  </script>
</head>

<body onload="checkAuthState()">

  <div id="navbar"></div> <!-- Placeholder for the navbar -->

  <div class="container">
    <!-- Dynamic buttons will be loaded here -->
  </div>
  
  <script src="../scripts/kontor.js"></script>
  <script src="../scripts/script.js"></script>
  <script src="../scripts/loadNavbar.js"></script> <!-- Add script to load navbar -->
</body>

</html>
