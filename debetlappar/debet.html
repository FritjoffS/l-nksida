<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Numreringsapp</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../styles/global.css" />
    <link rel="stylesheet" href="../styles/navbar.css" />

    <!-- Add Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-database.js"></script>
    <script src="../scripts/firebase-init.js"></script>
    
    <script>

        // Function to check if a user is logged in or not
        function checkAuthState() {
            firebase.auth().onAuthStateChanged(function(user) {
                if (!user) {
                    // User is not signed in, redirect to the login page
                    window.location.href = "../index/login.html";
                }
            });
        }

        // Function to log out the user
        function logout() {
            firebase.auth().signOut().then(function() {
                // Sign-out successful, redirect to login page
                window.location.href = "../index/login.html";
            }).catch(function(error) {
                // Handle errors here
                console.error("Logout error:", error);
            });
        }
    </script>
</head>

<body onload="checkAuthState()">
    <div id="navbar"></div> <!-- Placeholder for the navbar -->
    <div class="container">

        <div class="debet_container">
            <h1>Skriv Ut Debetlappar</h1>
            <h2>Välj antal:</h2>
            <input type="number" id="copies" min="1" value="1">
            <div class="button-group">
                <button class="processButton" id="processButton">Bearbeta och Ladda ner</button>
                <button id="openLastPdfButton">Öppna för att skriva ut</button>
            </div>
            <div id="status"></div>
        </div>

    </div>
    <!-- <button onclick="logout()">Logga ut</button> -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.9.359/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="app.js"></script>
    <script src="../scripts/loadNavbar.js"></script> <!-- Add script to load navbar -->
</body>

</html>
