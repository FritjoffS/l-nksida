<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale: 1.0">
    <meta author="Name" content="Fredrik Söderberg">
    <title>Lista Presentkort</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/navbar.css">
    <link rel="stylesheet" href="presentkort.css">
    
    
    <!-- Add Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-auth.js"></script>

    <script>
        // Initialize Firebase with your project's config
        var firebaseConfig = {
            apiKey: "AIzaSyDOFeJ1GvtXtffzCwQFg2M3CCVtpn875KQ",
            authDomain: "l-nksida.firebaseapp.com",
            databaseURL: "https://l-nksida-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "l-nksida",
            storageBucket: "l-nksida.firebasestorage.app",
            messagingSenderId: "258147870107",
            appId: "1:258147870107:web:ce637517bc30b7578cad3e"
        };
        firebase.initializeApp(firebaseConfig);

        // Function to check if a user is logged in or not
        function checkAuthState() {
            firebase.auth().onAuthStateChanged(function (user) {
                if (!user) {
                    // User is not signed in, redirect to the login page
                    window.location.href = "../index/login.html";
                }
            });
        }

        // Function to log out the user
        function logout() {
            firebase.auth().signOut().then(function () {
                // Sign-out successful, redirect to login page
                window.location.href = "../index/login.html";
            }).catch(function (error) {
                // Handle errors here
                console.error("Logout error:", error);
            });
        }
    </script>
</head>

<body onload="checkAuthState()">
    <div id="navbar"></div> <!-- Placeholder for the navbar -->

    <div id="listaPresentkortContainer">
        <h1>Lista Presentkort</h1>
        <table id="cardTable" border="1" style="width: 100%; border-collapse: collapse; text-align: left;">
            <thead>
                <tr>
                    <th>Serie nummer</th>
                    <th>Saldo (kr)</th>
                    <th>Ursprungligt värde</th> <!-- New column -->
                    <th>Försäljnings datum</th>
                    <th>Utgångs datum</th>
                    <th>Säljare</th>
                </tr>
            </thead>
            <tbody id="cardTableBody">
                <tr>
                    <td colspan="6" style="text-align: center;">Hämtar presentkort...</td>
                </tr>
            </tbody>
        </table>
        <button id="backToPresentkort">Tillbaka</button>
        
        <!-- Card Details Modal -->
        <div id="cardDetailsModal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 600px; max-height: 80vh; overflow-y: auto; background: white; border: 2px solid #333; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3); z-index: 1000;">
            <div id="cardDetailsContent">
                <p>Hämtar detaljer...</p>
            </div>
            <button id="closeCardDetails" style="background: #6c757d; margin-top: 15px; padding: 10px 20px; border: none; border-radius: 5px; color: white; cursor: pointer;">Stäng</button>
        </div>
        
        <!-- Overlay for modal -->
        <div id="modalOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 999;"></div>
    </div>

    <script src="listPresentkort.js" type="module"></script>
    <script src="../scripts/loadNavbar.js"></script> <!-- Add script to load navbar -->
    <script>
        document.getElementById("backToPresentkort").addEventListener("click", () => {
            window.location.href = "presentkort.html";
        });
    </script>

</body>

</html>
