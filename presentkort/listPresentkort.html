<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta author="Name" content="Fredrik Söderberg">
    <title>Lista Presentkort</title>
    <link rel="stylesheet" href="../styles/navbar.css">
    <link rel="stylesheet" href="presentkort.css">
    <link rel="stylesheet" href="../styles/global.css">
</head>

<body>
    <div id="navbar"></div> <!-- Placeholder for the navbar -->

    <div id="presentkortContainer">
        <h1>Lista Presentkort</h1>
        <table id="cardTable" border="1" style="width: 100%; border-collapse: collapse; text-align: left;">
            <thead>
                <tr>
                    <th>Serienummer</th>
                    <th>Saldo (kr)</th>
                    <th>Aktiveringsdatum</th>
                    <th>Utgångsdatum</th>
                    <th>Säljare</th>
                </tr>
            </thead>
            <tbody id="cardTableBody">
                <tr>
                    <td colspan="5" style="text-align: center;">Hämtar presentkort...</td>
                </tr>
            </tbody>
        </table>
        <button id="backToPresentkort">Tillbaka</button>
    </div>

    <script src="listPresentkort.js" type="module"></script>
    <script src="../scripts/loadNavbar.js"></script> <!-- Add script to load navbar -->
    <script>
        document.getElementById("backToPresentkort").addEventListener("click", () => {
            window.location.href = "presentkort.html";
        });
    </script>
</body>

</html>
