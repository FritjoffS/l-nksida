<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Presentkortshantering</title>
    <link rel="stylesheet" href="../styles/navbar.css">
    <link rel="stylesheet" href="presentkort.css">
    <link rel="stylesheet" href="../styles/global.css">

    <!-- Add Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-auth.js"></script>

    <script>
        // Initialize Firebase with your project's config
        var firebaseConfig = {
            apiKey: "AIzaSyDOFeJ1GvtXtffzCwQFg2M3CCVtpn875KQ",
            authDomain: "l-nksida.firebaseapp.com",
            databaseURL: "https://l-nksida-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "l-nksida",
            storageBucket: "l-nksida.firebasestorage.app",
            messagingSenderId: "258147870107",
            appId: "1:258147870107:web:ce637517bc30b7578cad3e"
        };
        firebase.initializeApp(firebaseConfig);

        // Function to check if a user is logged in or not
        function checkAuthState() {
            firebase.auth().onAuthStateChanged(function (user) {
                if (!user) {
                    // User is not signed in, redirect to the login page
                    window.location.href = "../index/login.html";
                }
            });
        }

        // Function to log out the user
        function logout() {
            firebase.auth().signOut().then(function () {
                // Sign-out successful, redirect to login page
                window.location.href = "../index/login.html";
            }).catch(function (error) {
                // Handle errors here
                console.error("Logout error:", error);
            });
        }
    </script>

</head>


<body onload="checkAuthState()">

    <div id="navbar"></div> <!-- Placeholder for the navbar -->

    <div id="presentkortContainer">

        <h1>Presentkortshantering</h1>

        <div id="inputCard">
            <label for="serialNumber">Presentkortets Serienummer:</label>
            <input type="text" id="serialNumber" placeholder="Ange serienummer">
            <div style="display: flex; gap: 10px;">
                <button id="checkCard">Lös in / Kontrollera Presentkort</button>
                <button id="getNextSerialNumber">Sälj Presentkort</button>
                <button id="listCards">Lista Presentkort</button> <!-- Updated button -->
            </div>
        </div>

        <div id="filterDialog"
            style="display: none; margin-top: 20px; border: 2px solid #333; padding: 20px; border-radius: 10px;">

            <h2>Filtrera Presentkort</h2>

            <div class="filterElements">
                <div>
                    <label>Visa Aktiva Presentkort<input type="checkbox" id="showActiveCards"></label>
                </div>
                <div>
                    <label>Visa Utgångna Presentkort<input type="checkbox" id="showExpiredCards"></label>
                </div>
                <div class="dateRange">
                    <div>
                        <label>Försäljningsdatum Från:</label>
                        <input type="date" id="activatedFrom">
                    </div>
                    <div>
                        <label>Försäljningsdatum Till:</label>
                        <input type="date" id="activatedTo">
                    </div>
                </div>
            </div>

            <button id="applyFilters">Tillämpa Filter</button>
        </div>

        <div id="cardInfo" style="display: none;">
            <h2>Presentkort Information</h2>
            <p id="cardValue"></p>
            <label for="redeemAmount">Belopp att lösa in:</label>
            <input type="number" id="redeemAmount" placeholder="Ange belopp">
            <button id="redeemCard">Lös in</button>
            <button id="viewHistory">Visa Historik</button> <!-- New button -->
        </div>

        <div id="activateCard" style="display: none;">
            <h2>Sälj Nytt Presentkort</h2>
            <div style="display: flex; gap: 10px; align-items: center;">
                <div>
                    <label for="cardValueInput">Önskat värde på presentkort:</label>
                    <input type="number" id="cardValueInput" placeholder="Ange värde">
                </div>
                <div>
                    <label for="sellerName">Säljare:</label>
                    <input type="text" id="sellerName" placeholder="Ange ditt namn">
                </div>
            </div>
            <button id="activateCardButton">Ladda Presentkort</button>
        </div>
    </div>

    <script type="module" src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js"></script>
    <script type="module" src="presentkort.js"></script>
    <script src="../scripts/loadNavbar.js"></script> <!-- Add script to load navbar -->
    <script>
        // Ta bort omdirigeringen här
        // document.getElementById("listCards").addEventListener("click", () => {
        //     window.location.href = "listPresentkort.html";
        // });
    </script>
</body>

</html>
