    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/navbar.css">
    <link rel="stylesheet" href="presentkort.css">

    <!-- Add Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.5/firebase-auth.js"></script>

    <script>
        // Initialize Firebase with your project's config
        var firebaseConfig = {
            apiKey: "AIzaSyDOFeJ1GvtXtffzCwQFg2M3CCVtpn875KQ",
            authDomain: "l-nksida.firebaseapp.com",
            databaseURL: "https://l-nksida-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "l-nksida",
            storageBucket: "l-nksida.firebasestorage.app",
            messagingSenderId: "258147870107",
            appId: "1:258147870107:web:ce637517bc30b7578cad3e"
        };
        firebase.initializeApp(firebaseConfig);

        // Function to check if a user is logged in or not
        function checkAuthState() {
            firebase.auth().onAuthStateChanged(function (user) {
                if (!user) {
                    // User is not signed in, redirect to the login page
                    window.location.href = "../index/login.html";
                }
            });
        }

        // Function to log out the user
        function logout() {
            firebase.auth().signOut().then(function () {
                // Sign-out successful, redirect to login page
                window.location.href = "../index/login.html";
            }).catch(function (error) {
                // Handle errors here
                console.error("Logout error:", error);
            });
        }
    </script>

</head>


<body onload="checkAuthState()">

    <div id="navbar"></div> <!-- Placeholder for the navbar -->

    <h1>Presentkortshantering</h1>
    <div>
        <label for="serialNumber">Serienummer:</label>
        <input type="text" id="serialNumber" placeholder="Ange serienummer">
        <button id="checkCard">Kontrollera</button>
    </div>
    <div id="cardInfo" style="display: none;">
        <p id="cardValue"></p>
        <label for="redeemAmount">Belopp att lösa in:</label>
        <input type="number" id="redeemAmount" placeholder="Ange belopp">
        <button id="redeemCard">Lös in</button>
    </div>
    <div id="activateCard" style="display: none;">
        <label for="cardValueInput">Värde på presentkort:</label>
        <input type="number" id="cardValueInput" placeholder="Ange värde">
        <label for="sellerName">Säljare:</label>
        <input type="text" id="sellerName" placeholder="Ange ditt namn">
        <button id="activateCardButton">Aktivera</button>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js"></script>
    <script src="presentkort.js" type="module"></script>
    <script src="../scripts/loadNavbar.js"></script> <!-- Add script to load navbar -->
</body>
